name: package-smoke

# 只做"打包链路还能不能跑通"的验证，产出物仅作为 Actions artifact 供人工检查，
# 不创建 Release。目的：让"打包坏了"在 PR 阶段就暴露，而不是等到打 tag 才发现。
#
# 触发条件刻意收窄（只在与打包相关的文件变动时跑），避免每次改文档都烧 20 分钟
# 的 Windows runner；release.yml 里还有一份完整的双平台构建。
on:
  pull_request:
    paths:
      - 'docs/Releases/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tools/check_packaging.py'
      - 'tools/check_build_tree.py'
      - '.github/actions/**'
      - '.github/workflows/package-smoke.yml'
  push:
    branches: [main, develop]
    paths:
      - 'docs/Releases/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tools/check_packaging.py'
      - 'tools/check_build_tree.py'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  smoke:
    name: 打包冒烟（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: docs/Releases/cubby.spec
            expect_exe: Cubby.exe
          - os: ubuntu-latest
            spec: docs/Releases/cubby-linux.spec
            expect_exe: Cubby
    steps:
      - uses: actions/checkout@v4

      # 构建与 release.yml 完全同一条路：Windows 在宿主上跑 PyInstaller；Linux 在
      # debian:12 容器里构建（glibc 2.36 基线，与发布产物一致）。setup-python 只服务
      # 工具脚本：不能用它那份 libpython 去构建 Linux 产物（产物启动报
      # "Failed to load Python shared library .../libpython3.12.so.1.0"）。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 打包规则检查
        run: python tools/check_packaging.py

      - name: 构建前端
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: PyInstaller 打包（Windows）
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller
          --workpath .build-work
          --distpath .build-dist
          --noconfirm
          --log-level WARN
          ${{ matrix.spec }}

      - name: PyInstaller 打包（Linux，debian:12 容器）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv python3-pip binutils
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q --upgrade pip
            /tmp/venv/bin/pip install -q -r requirements-dev.txt
            /tmp/venv/bin/python -m PyInstaller --workpath .build-work --distpath .build-dist --noconfirm --log-level WARN docs/Releases/cubby-linux.spec
            mv -f .build-dist/Cubby/Cubby.bin .build-dist/Cubby/Cubby
            chmod +x .build-dist/Cubby/Cubby
            /tmp/venv/bin/pip freeze > .build-dist/Cubby/requirements.lock.txt
          '

      - name: 校验产物内容
        run: >-
          python tools/check_build_tree.py
          .build-dist/Cubby
          --expect-exe ${{ matrix.expect_exe }}

      # 与 release.yml 同一条判据：在 debian:12 里真起一次 --web-only 并探 /health。
      - name: Linux 产物在 debian:12 里起得来
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.build-dist/Cubby:/srv/Cubby:ro" -e CUBBY_HOME=/tmp/cubby-home debian:12 bash -lc '
            set -euo pipefail
            /srv/Cubby/Cubby --web-only --port 18080 >/tmp/cubby.log 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 40); do
              if (exec 3<>/dev/tcp/127.0.0.1/18080) 2>/dev/null; then ok=1; break; fi
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$ok" != 1 ]; then
              echo "::error::产物在 debian:12 里没有起来"
              tail -20 /tmp/cubby.log
              exit 1
            fi
            echo "产物在 debian:12 里启动并通过 /health"
          '

      # 安装器只在 Windows 上有；它与 release.yml 共用同一个 composite action，
      # 所以改 docs/Releases/** 时这里就会真编译一次 iscc 并做静默安装/卸载冒烟 ——
      # 不必等到打 tag 才知道安装器坏了。版本号由 action 内部按 pyproject 取。
      - name: 构建 Windows 安装器
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-installer
        with:
          source-dir: .build-dist/Cubby
          output-dir: .build-dist
          artifact-name: package-smoke-installer

      - name: 上传产物供人工验证
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.os }}
          path: .build-dist/Cubby
          retention-days: 7
