name: package-smoke

# 只做"打包链路还能不能跑通"的验证，产出物仅作为 Actions artifact 供人工检查，
# 不创建 Release。目的：让"打包坏了"在 PR 阶段就暴露，而不是等到打 tag 才发现。
#
# 触发条件刻意收窄（只在与打包相关的文件变动时跑），避免每次改文档都烧 20 分钟
# 的 Windows runner；release.yml 里还有一份完整的双平台构建。
#
# 这里的 paths 是**真正的构建输入**，不是整个 docs/Releases/：改
# docs/Releases/AGENTS.md 之类的文档不该触发双平台真构建；而这两个 workflow 自身
# 与安装器 composite action 改坏了，必须在这里跑一次才能发现。
on:
  pull_request:
    paths:
      - 'docs/Releases/*.iss'
      - 'docs/Releases/*.isl'
      - 'docs/Releases/installer-*.png'
      - 'docs/Releases/installer-notes.txt'
      - 'docs/Releases/cubby.spec'
      - 'docs/Releases/cubby-linux.spec'
      - 'docs/Releases/spec_common.py'
      - 'docs/Releases/migrate-*'
      - 'docs/Releases/build-release.*'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tools/check_packaging.py'
      - 'tools/check_build_tree.py'
      - '.github/actions/**'
      - '.github/workflows/package-smoke.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main, develop]
    paths:
      - 'docs/Releases/*.iss'
      - 'docs/Releases/*.isl'
      - 'docs/Releases/installer-*.png'
      - 'docs/Releases/installer-notes.txt'
      - 'docs/Releases/cubby.spec'
      - 'docs/Releases/cubby-linux.spec'
      - 'docs/Releases/spec_common.py'
      - 'docs/Releases/migrate-*'
      - 'docs/Releases/build-release.*'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tools/check_packaging.py'
      - 'tools/check_build_tree.py'
      - '.github/actions/**'
      - '.github/workflows/package-smoke.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  smoke:
    name: 打包冒烟（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: docs/Releases/cubby.spec
            expect_exe: Cubby.exe
          - os: ubuntu-latest
            spec: docs/Releases/cubby-linux.spec
            expect_exe: Cubby
    steps:
      - uses: actions/checkout@v4

      # 构建与 release.yml 完全同一条路：Windows 在宿主上跑 PyInstaller；Linux 在
      # debian:12 容器里构建（glibc 2.36 基线，与发布产物一致）。setup-python 只服务
      # 工具脚本：不能用它那份 libpython 去构建 Linux 产物（产物启动报
      # "Failed to load Python shared library .../libpython3.12.so.1.0"）。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 打包规则检查
        run: python tools/check_packaging.py

      - name: 构建前端
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: PyInstaller 打包（Windows）
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller
          --workpath .build-work
          --distpath .build-dist
          --noconfirm
          --log-level WARN
          ${{ matrix.spec }}

      # 与 release.yml 的 Linux 打包步骤同一条路：debian:12 容器（glibc 2.36 基线）+ 同一套
      # 构建期依赖 + 同一个 PyGObject 版本，这样冒烟出来的产物与发布产物同构（都含 gi/_gi）。
      - name: PyInstaller 打包（Linux，debian:12 容器）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # build-essential / ninja-build：PyGObject 与 pycairo 只有源码包，pip 的
            # build isolation 只装 meson 与 meson-python，编译器与 ninja 得由系统提供
            # （debian:12 基础镜像两者都没有）。其余是编译所需的头文件、pkg-config
            # 描述与 GTK/WebKit2 的 typelib。
            apt-get install -y -qq python3 python3-venv python3-pip binutils \
              build-essential ninja-build pkg-config python3-dev \
              libgirepository1.0-dev libcairo2-dev \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.1
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q --upgrade pip
            /tmp/venv/bin/pip install -q -r requirements-dev.txt
            # 窗口的 Python 绑定：固定 3.48.2。bookworm 的 glib 是 2.74、
            # gobject-introspection 是 1.74，3.48.x 仍走 girepository-1.0；3.50 起改用
            # girepository-2.0（已并入 glib，要求 glib >= 2.80），这里编不过。
            /tmp/venv/bin/pip install -q "PyGObject==3.48.2"
            /tmp/venv/bin/python -m PyInstaller --workpath .build-work --distpath .build-dist --noconfirm --log-level WARN docs/Releases/cubby-linux.spec
            mv -f .build-dist/Cubby/Cubby.bin .build-dist/Cubby/Cubby
            chmod +x .build-dist/Cubby/Cubby
            # 发布包里的"只跑 HTTP 服务"启动器随 datas 进来，datas 拷贝不保留可执行位
            chmod +x .build-dist/Cubby/cubby-web.sh
            # 依赖快照写到产物目录树之外：本 workflow 会把 .build-dist/Cubby 整个传成
            # artifact，而且 check_build_tree 会断言产物里没有 requirements.lock.txt。
            # 它只用于审计构建环境（含 pyright/ruff/pyinstaller 这类构建依赖），不能随包
            # 分发；同时打进日志供复核。
            /tmp/venv/bin/pip freeze > .build-dist/requirements.lock.txt
            echo "--- requirements.lock.txt（仅审计，不随包分发）---"
            cat .build-dist/requirements.lock.txt
          '

      - name: 校验产物内容
        run: >-
          python tools/check_build_tree.py
          .build-dist/Cubby
          --expect-exe ${{ matrix.expect_exe }}

      # 与 release.yml 同一条判据：在 debian:12 里真起一次 --web-only，再由容器内的
      # python3 发 HTTP GET /health 并等 200。连得上端口不算数（服务绑上了端口但
      # /health 返回 500 也是坏的）；debian:12 基础镜像没有 curl，所以先装 python3。
      # 通过发布包里的 cubby-web.sh 启动：启动器本身是产物，路径解析/参数透传坏了要在这里暴露。
      - name: Linux 产物在 debian:12 里起得来且 /health 返回 200
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.build-dist/Cubby:/srv/Cubby:ro" -e CUBBY_HOME=/tmp/cubby-home debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq python3 >/dev/null
            cd /srv/Cubby
            ./cubby-web.sh --port 18080 >/tmp/cubby.log 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 40); do
              # 真的发 HTTP GET：连得上端口只说明进程在听，/health 返回非 2xx 同样算失败。
              if python3 -c "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen(sys.argv[1], timeout=2).status == 200 else 1)" "http://127.0.0.1:18080/health" >/tmp/health.log 2>&1; then ok=1; break; fi
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$ok" != 1 ]; then
              echo "::error::产物在 debian:12 里没有起来，或 /health 没有返回 200"
              tail -20 /tmp/cubby.log
              echo "--- /health 探测输出 ---"
              tail -5 /tmp/health.log 2>/dev/null || true
              exit 1
            fi
            echo "产物在 debian:12 里启动，且 /health 返回 200"
          '

      # 与 release.yml 同一步、同一套断言：能起 --web-only 不代表能开窗。这里装 Xvfb 与
      # 系统 WebKitGTK，用 xvfb-run 起一次真实窗口；main.py 的冒烟钩子在
      # CUBBY_WINDOW_SMOKE_MS 毫秒后自动关窗，所以进程应当自己以 0 退出。断言两条：
      # 超时时间内退出码为 0、日志里出现建窗成功那一行。缺 WebKitGTK 时进程会降级到
      # --web-only 一直服务，被 timeout 杀掉，两条断言都会失败。
      # 放在这里（而不是只在 release.yml）：这份冒烟在 PR 阶段跑，spec / PyGObject
      # 版本 / 剔除规则出问题时，正好在改动它的 PR 上暴露，不必等打 tag。
      - name: Linux 产物在 debian:12 里开得起 GTK 窗口
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.build-dist/Cubby:/srv/Cubby:ro" -e CUBBY_HOME=/tmp/cubby-home debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            # xvfb / xauth 提供虚拟显示；dbus-x11 提供会话总线的启动器（GTK 缺它会告警）；
            # 系统 WebKitGTK 与 GTK 的 typelib 是运行时依赖，产物里只有 Python 绑定。
            apt-get install -y -qq xvfb xauth dbus-x11 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 gir1.2-gtk-3.0 >/dev/null
            export HOME=/tmp/cubby-home
            export XDG_RUNTIME_DIR=/tmp/xdg-runtime
            mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            # Xvfb 没有 GPU：WebKitGTK 2.42 起默认的 DMA-BUF 渲染器在无 GPU 环境会失败，
            # 显式走软件渲染路径。这只改合成方式，窗口本身仍由系统的 GTK 创建。
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export LIBGL_ALWAYS_SOFTWARE=1
            export CUBBY_WINDOW_SMOKE_MS=8000
            status=0
            timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" /srv/Cubby/Cubby --port 18081 >/tmp/window.log 2>&1 || status=$?
            if [ "$status" != 0 ]; then
              echo "::error::Linux 产物没能开窗：进程退出码 $status（124 表示超时，通常是降级成 --web-only 一直服务）"
              tail -40 /tmp/window.log
              exit 1
            fi
            if ! grep -Fq "[Cubby] 桌面窗口已创建" /tmp/window.log; then
              echo "::error::Linux 产物日志里没有建窗成功那一行，窗口没有真正创建"
              tail -40 /tmp/window.log
              exit 1
            fi
            echo "Linux 产物在 debian:12 + Xvfb 里创建了 GTK 窗口，并按冒烟钩子自行退出"
          '

      # 与 release.yml 同一步：Cubby-Web.cmd 除了存在，还真跑一次（启动 → /health →
      # taskkill 整棵树），确认脚本把参数透传给了主程序。
      - name: Windows 产物里的 web-only 启动器可用
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Join-Path '.build-dist/Cubby' 'Cubby-Web.cmd'
          if (-not (Test-Path -LiteralPath $launcher)) {
            Write-Error "产物里没有 Cubby-Web.cmd"
            exit 1
          }
          $env:CUBBY_HOME = Join-Path $env:RUNNER_TEMP 'cubby-home'
          $proc = Start-Process -FilePath $launcher -ArgumentList '--port', '18090' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                # -NoProxy：CI 环境里的 HTTP(S)_PROXY 会让本机探活被交给代理
                $resp = Invoke-WebRequest -NoProxy -UseBasicParsing -Uri 'http://127.0.0.1:18090/health' -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ok) {
              Write-Error "Cubby-Web.cmd 启动后 /health 没有返回 200"
              exit 1
            }
            Write-Output 'Cubby-Web.cmd 启动成功，/health 返回 200'
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }
          }

      # 安装器只在 Windows 上有；它与 release.yml 共用同一个 composite action，
      # 所以改安装器的构建输入时这里就会真编译一次 iscc 并做静默安装/卸载冒烟 ——
      # 不必等到打 tag 才知道安装器坏了。版本号由 action 内部按 pyproject 取。
      - name: 构建 Windows 安装器
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-installer
        with:
          source-dir: .build-dist/Cubby
          output-dir: .build-dist
          artifact-name: package-smoke-installer

      - name: 上传产物供人工验证
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.os }}
          path: .build-dist/Cubby
          # 产物在 .build-dist/ 下，而 upload-artifact v4 默认把"点开头的目录里的文件"
          # 当隐藏文件排除（include-hidden-files 默认 false）：不加这一行会得到 0 个文件，
          # 只打印一条 warning 就交出一个空 artifact。if-no-files-found 再兜一层，
          # 让"路径写错/过滤语义变化"变成红的，而不是静默的空包。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
