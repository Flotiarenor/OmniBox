name: ci

# 最小可用 CI：只做"已确认为真"的门禁，不做会红的检查。
# runner 必须是 windows-latest：tests/test_pixiv_sync.py 的 SQLite 临时目录
# 清理错误是 Windows 专属现象，Linux runner 会永久掩盖它。
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖（运行时 + 开发）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: 语法级静态检查（ruff 严重错误子集）
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: 插件规范检查
        run: python tools/check_plugins.py

      - name: 单元测试（全量，含 pixiv-sync / Host 白名单 / ncm-cli 注入回归）
        run: python -m unittest discover -s tests

      - name: 前端转义一致性（属性注入门禁）
        run: node tools/check_frontend_escape.cjs

      - name: 前端类型检查与构建
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build
