name: ci

# 门禁总览（每一条都在本地实测过，见 docs/ci-and-release.md）：
#   changes     —— 变更集判定：算出这次只动了文档还是动了代码，其余 job 靠它的输出决定跑不跑
#   plugins     —— 从 plugins/*/manifest.json 生成插件矩阵，新增插件不用改本文件
#   lint        —— ruff 全量 + 插件规范 + 插件后端分层 + 打包规则 + 版本一致性 + 图标 sprite
#                  + 测试文件可运行性 + 文档引用一致性（本地隐私门禁只在开发机跑，runner 上必然 SKIP）
#   docs        —— 只在变更集含 .md 时跑：文档引用一致性（AGENTS.md 的名字 / 路径 / 链接）
#   typecheck   —— pyright（内核 + 全部插件，零错误硬门禁）
#   test        —— 构建前端 + 共享测试（tools/plugin_ci.py --core），Windows + Linux 双平台
#   plugin      —— 每个插件一条 job（tools/plugin_ci.py --plugin <name>），Windows + Linux
#   frontend    —— 转义一致性门禁 + vue-tsc 类型检查 + vite 构建
#   shell-e2e   —— 真实浏览器冒烟：真实壳 + 无头 Chrome，跑 tests/test_shell_browser_e2e.py
#                  （导航渲染 / iframe 挂载 / 生命周期通知 / 控制台零错误），缺环境即失败
#   package     —— 真实跑一次 PyInstaller 并校验产物内容
#
# 已删除的“不会失败”步骤：ruff format --check（continue-on-error）、pyright plugins tests
# （continue-on-error）、CI 里的 check_private_paths（runner 没有本地配置，必然 SKIP）。
#
# 为什么 test/package 必须包含 windows-latest：
# 历史缺陷里有一批是 Windows 专属的（SQLite 临时目录被占用导致清理失败、
# PATH 分隔符写死 ':'、文件锁定）。只用 Linux runner 会永久掩盖它们。
#
# 为什么**不**在 on: 上用 paths / paths-ignore 过滤：
# 被路径过滤掉的工作流根本不启动，也就不会创建 check run —— 一旦本工作流被设为必需检查，
# PR 会永远停在 "Expected — Waiting for status to be reported"，而 GitHub 没有"缺失的
# 检查算通过"这个开关。改用 job 级过滤：一个便宜的 changes job 先算出变更集，其余 job 用
# `if:` 决定跑不跑 —— 被 `if` 跳过的 job 会以 Success 上报，必需检查因此不会被卡住。
#
#   只有 .md 改动  → changes + docs（约 10 秒），代码门禁全部跳过
#   .md + 代码     → 全跑
#   只有代码       → 除 docs 外全跑
#
# 判定规则只有两条分支（见 changes job）：`*.md` 算文档，其余任何文件都算"动了代码"。
# 因此 LICENSE / .gitignore 这类少见改动会照常全跑 —— 宁可多跑一次，不要少跑一次；
# 判定不出变更集时（例如强推导致取不到比对点）同样按"动了代码"处理。
# 哪些东西算"代码"：除 `*.md` 之外的一切，包括 docs/Releases/**（打包 spec 与资源，是构建
# 输入不是文档）、.github/workflows/**（改坏一次会静默失去所有门禁）、tools/** 与 tests/**。
#
# **纪律**：新增 job 必须同时写 `needs: changes` 与 `if: needs.changes.outputs.code == 'true'`
# 或 `if: needs.changes.outputs.docs == 'true'` —— 漏写就是"每次全跑"或"永远不跑"。
#
# 为什么文档门禁要单独一个 job：除 check_docs.py 之外，其余门禁全部只读代码 —— ruff 不扫
# Markdown，check_version/check_plugins/check_packaging 读的是 pyproject/package.json/
# manifest/spec，前端 job 只构建 src/ 里的 TS/Vue。所以纯文档改动只需要跑 check_docs.py；
# lint 里也保留一份，用来拦"代码改了、文档没跟上"（那是删除/改名符号的主要方向）。
# 另外「只改注释/格式」的代码改动无法按路径识别，只能照常跑（跑一遍最省心）。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧的运行，省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  # Windows runner 默认 ANSI cp1252；门禁与测试会输出中文，统一 UTF-8 避免 UnicodeEncodeError。
  PYTHONIOENCODING: 'utf-8'

jobs:
  changes:
    name: 变更集判定
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要与比对点算出完整变更集，浅克隆里没有那些对象
          fetch-depth: 0

      # 判定只有两条分支：`*.md` 算文档，其余任何文件都算"动了代码"。
      # 用 bash 的 case 而不是 on: 上的 `**/*.md`：case 模式里 `*` 可以跨 `/`，根目录与
      # 任意层级的 .md 都命中，不依赖 `**` 是否匹配"零个目录"（这一点文档没有定论）。
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "手动触发：全部跑"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            # 新建分支的首次推送：before 是全 0，退回到"与上一个提交比"
            base=$(git rev-parse "$SHA^" 2>/dev/null || echo "$SHA")
          fi

          # 判定步骤自己绝不能失败：changes 失败会让所有 needs 它的 job 被跳过，而被跳过的
          # job 上报 Success —— 那就是"门禁静默没跑"。取不到比对点时必须退化成"按代码处理"。
          if ! changed=$(git diff --name-only "$base" "$SHA" 2>/dev/null); then
            echo "取不到变更集（$base..$SHA），按「动了代码」处理"
            changed=""
          fi
          printf '变更集：\n%s\n' "$changed"

          code=false
          docs=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md) docs=true ;;
              *)    code=true ;;
            esac
          done <<< "$changed"

          if [ -z "$changed" ]; then
            # 取不到变更集时按"动了代码"处理：宁可多跑一次，也不要静默少跑
            echo "变更集为空，按「动了代码」处理"
            code=true
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  docs:
    name: docs（AGENTS.md 引用一致性）
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只用到标准库：不装 Python 依赖，也不构建前端 —— 纯文档改动只跑这一个 job
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 文档引用一致性（AGENTS.md 的名字 / 路径 / 链接）
        run: python tools/check_docs.py

  plugins:
    name: 插件矩阵
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4

      # 只读 manifest 目录：不装项目依赖，矩阵由插件目录动态生成，新增插件不用改 workflow。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: list
        name: 读取插件清单
        run: echo "names=$(python tools/plugin_ci.py --list)" >> "$GITHUB_OUTPUT"

  lint:
    name: lint（ruff + 规范 + 版本 + 测试/图标）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff（全量，含 E9/F 语法与未定义名字）
        run: python -m ruff check .

      - name: 插件规范检查
        run: python tools/check_plugins.py

      # 后端分层门禁：禁 Mixin 切分、文件行数上限、只有入口可以加载兄弟模块。
      # 尚未迁移的插件靠 tools/layering_allowlist/<plugin>.txt 豁免（每个插件一份，
      # 迁移完成即删除），因此这条步骤在迁移进行中是"逐插件收紧"的棘轮。
      - name: 插件后端分层检查
        run: python tools/check_plugin_layering.py

      - name: 打包规则检查（spec 与数据收集）
        run: python tools/check_packaging.py

      - name: 版本一致性（pyproject / package.json / package-lock.json）
        run: python tools/check_version.py

      - name: 图标 sprite 一致性（sprite ↔ icon_data ↔ 引用）
        run: python tools/build_icons.py --check

      # 图标是逐字节比对：只有几何绘制、不读字体，所以这一条能跑在 Linux 的 lint 上。
      - name: 应用图标一致性（res/brand ↔ 生成脚本，逐字节、不读字体）
        run: python tools/build_brand.py --check-icons

      # 向导图只做形态校验（存在 / 可解码 / 尺寸对得上三档 DPI）：向导图要用 Windows
      # 系统字体渲染，而 runner 上没有那套字体、Server 镜像的字体版本也不同，逐字节
      # 比对只会在 CI 上红。逐字节那一份留给本地提交前的 --check（见 AGENTS.md）。
      - name: 安装器向导图形态（存在 / 可解码 / 尺寸，不读字体）
        run: python tools/build_brand.py --check-banners

      - name: 测试文件可运行性（tests/test_*.py 必须真的有用例）
        run: python tools/check_tests.py

      # 文档引用一致性：AGENTS.md 反引号里的名字/路径、围栏命令里的路径、Markdown 链接
      # 都必须还存在。纯文档改动的方向由上面的 docs job 兜（同一个脚本），这里这一份
      # 兜的是"代码改了、文档没跟上"。
      - name: 文档引用一致性（AGENTS.md 的名字 / 路径 / 链接）
        run: python tools/check_docs.py

  typecheck:
    name: typecheck（pyright，内核 + 全部插件）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖（pyright 需要能解析 flask/PIL/webview）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # 一条命令覆盖内核与全部插件。插件曾经因为 mixin 分片带来的 603 条伪影被整体排除在
      # 门禁之外，组件化之后清零，类型检查才重新成为插件代码的真实约束。
      - name: pyright（内核 + 全部插件，零错误门禁）
        run: python -m pyright main.py shell tools plugins

  test:
    name: test（${{ matrix.os }} / py${{ matrix.python }}）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # 壳首页（/、/settings、插件路由）由 shell/frontend/dist/index.html 提供，
      # serve_shell 在它缺失时直接 404；而 dist/ 在 .gitignore 里，CI 上不存在。
      # 不构建就有 7 个用例（tests/test_file_server_shell_state.py）拿不到首页。
      - name: 构建前端（壳首页的提供来源）
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: 单元测试（共享）
        run: python tools/plugin_ci.py --core

  plugin:
    name: plugin / ${{ matrix.plugin }}（${{ matrix.os }}）
    needs: [changes, plugins]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        plugin: ${{ fromJSON(needs.plugins.outputs.names) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 每个插件一条独立 job：失败能直接落到插件名；测试归属由 tools/plugin_ci.py 按
      # test_<插件名下划线>_* 前缀决定，新增插件不需要改本文件。
      - name: 插件测试（${{ matrix.plugin }}）
        run: python tools/plugin_ci.py --plugin "${{ matrix.plugin }}"

  frontend:
    name: frontend（转义门禁 + 类型 + 构建）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      # audit 门禁是 Python 脚本（只用到标准库），显式装一遍而不是赌 runner 自带的 python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 前端转义一致性（属性注入门禁）
        run: node tools/check_frontend_escape.cjs

      - name: 安装依赖（npm ci：按锁文件可复现）
        run: npm --prefix shell/frontend ci

      - name: 依赖漏洞门禁（npm audit，显式走官方 registry）
        # 本机默认 registry 是 npmmirror，它不实现 audit 端点 —— 直接 npm audit 只会
        # 得到 NOT_IMPLEMENTED，等于这个仓库从来没检查过漏洞。脚本内部固定官方源。
        run: python tools/check_npm_audit.py

      - name: 类型检查与构建（vue-tsc --noEmit && vite build）
        run: npm --prefix shell/frontend run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: shell/frontend/dist
          retention-days: 7

  shell-e2e:
    name: shell-e2e（真实浏览器冒烟）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 只跑 ubuntu：这条门禁验的是壳前端的 DOM / 生命周期链路，与操作系统无关；
    # Windows 专属路径（PATH 分隔符、文件锁定）由 test / plugin 的 Windows 矩阵覆盖。
    runs-on: ubuntu-latest
    # 浏览器卡死时不要拖满默认的 6 小时：一分钟级的门禁，15 分钟足够外部依赖（驱动下载）兜底。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-e2e.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      # selenium 只在 requirements-e2e.txt 里（其余 job 不装它），这条 job 是它唯一的消费者。
      - name: 安装依赖（开发依赖 + selenium）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-e2e.txt

      # 浏览器驱动缓存：Selenium Manager 优先用缓存/镜像里与 Chrome 版本匹配的驱动，
      # 命中时不必联网下载。镜像自带的 Chrome 升级后缓存会不匹配，Manager 会自己重下
      # （cache 失效不影响正确性，只影响速度）。
      - name: 缓存浏览器驱动（Selenium Manager）
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}
          restore-keys: |
            selenium-${{ runner.os }}-

      # 壳首页由 shell/frontend/dist/index.html 提供，不构建就 404；此时 e2e 会在启动阶段
      # 拿不到首页，属于"环境没准备好"，入口会直接以非 0 退出而不是跳过。
      - name: 构建前端（壳首页的提供来源）
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      # ubuntu-latest 自带 Google Chrome（名字是 google-chrome，不是 harness 认的 chrome），
      # 入口先按更宽的名字定位，必要时把可执行文件以 chrome 的名字挂进 PATH。
      # 驱动由 Selenium Manager 解析：优先本地/缓存，缺失才下载；拿不到驱动时 e2e 的
      # setUpClass 抛 SkipTest，入口把"被跳过"判为失败并以 1 退出，日志里带原因 ——
      # 外部下载失败只会是"带原因的红"，不会静默变绿。
      - name: 真实浏览器冒烟（壳整体链路 + 分隔条）
        run: python tools/shell_e2e_smoke.py

  package:
    name: package（PyInstaller 冒烟 + 产物校验，${{ matrix.os }}）
    # shell-e2e 也是前置：壳在真实浏览器里交互坏了就不该产出安装包。
    needs: [changes, lint, test, plugin, frontend, shell-e2e]
    # 打包不在每次 push / PR 上跑：省掉 Linux + Windows 两个 runner 与约 100s 墙钟。
    # 覆盖率没有丢：
    #   - 改到打包相关文件（docs/Releases/**、requirements*.txt、pyproject.toml、
    #     tools/check_packaging.py、tools/check_build_tree.py）时，package-smoke.yml
    #     会在 PR 与 main/develop push 上按路径触发，跑的是同一套双平台 PyInstaller
    #     + check_build_tree.py 产物校验；
    #   - 进主干（push main）或手动触发时，这里再各跑一次，作为"改应用代码把打包
    #     悄悄改坏"（例如新增 PyInstaller 看不见的导入）的最后一道闸。
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: docs/Releases/cubby.spec
            dist: .build-dist
            expect_exe: Cubby.exe
          - os: ubuntu-latest
            spec: docs/Releases/cubby-linux.spec
            dist: .build-dist
            expect_exe: Cubby.bin
    steps:
      - uses: actions/checkout@v4

      # Windows 走 setup-python；Linux 用发行版 python3 + venv —— setup-python 那份
      # libpython 与打包产物不兼容：产物启动时报
      # "Failed to load Python shared library .../libpython3.12.so.1.0"（详见 release.yml
      # build job 的注释）。venv 的 bin 追加到 GITHUB_PATH，后续 `python` 就是它。
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Linux 构建前置（发行版 Python + venv + binutils）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip binutils
          # venv 放在工作区**外面**：放进仓库会被 ruff 之类的工具当成源码扫到
          # （extend-exclude 里没有 .venv-build，实测 verify 的 ruff 直接炸掉）。
          python3 -m venv "$RUNNER_TEMP/cubby-build-venv"
          echo "$RUNNER_TEMP/cubby-build-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # spec 现在会在缺少前端产物时硬失败；这里按发布路径真实构建一次前端。
      - name: 构建前端（发布路径）
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: PyInstaller 打包
        run: >-
          python -m PyInstaller
          --workpath .build-work
          --distpath ${{ matrix.dist }}
          --noconfirm
          --log-level WARN
          ${{ matrix.spec }}

      - name: 校验产物内容
        run: >-
          python tools/check_build_tree.py
          ${{ matrix.dist }}/Cubby
          --expect-exe ${{ matrix.expect_exe }}

      - name: 上传产物（供人工验证，非发布）
        uses: actions/upload-artifact@v4
        with:
          name: cubby-preview-${{ matrix.os }}
          path: ${{ matrix.dist }}/Cubby
          # 产物在 .build-dist/ 下，而 upload-artifact v4 默认把"点开头的目录里的文件"
          # 当隐藏文件排除（include-hidden-files 默认 false）：不加这一行会得到 0 个文件，
          # 只打印一条 warning 就交出一个空 artifact。if-no-files-found 再兜一层，
          # 让"路径写错/过滤语义变化"变成红的，而不是静默的空包。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
