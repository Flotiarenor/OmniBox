name: ci

# 门禁总览（每一条都在本地实测过，见 docs/ci-and-release.md）：
#   lint        —— ruff 全量 + 插件规范 + 打包规则 + 版本一致性 + 图标 sprite + 测试文件可运行性
#   typecheck   —— pyright（内核零错误硬门禁；插件/测试先输出基线不拦截）
#   test        —— unittest 全量，Windows + Linux 双平台
#   frontend    —— 转义一致性门禁 + vue-tsc 类型检查 + vite 构建
#   package     —— 真实跑一次 PyInstaller 并校验产物内容
#
# 为什么 test/package 必须包含 windows-latest：
# 历史缺陷里有一批是 Windows 专属的（SQLite 临时目录被占用导致清理失败、
# PATH 分隔符写死 ':'、文件锁定）。只用 Linux runner 会永久掩盖它们。
#
# 为什么纯文档改动不跑（paths-ignore）：
# 这 5 个门禁全部只读代码 —— ruff 不扫 Markdown，check_version/check_plugins/
# check_packaging 读的是 pyproject/package.json/manifest/spec，前端 job 只构建
# src/ 里的 TS/Vue。因此改 .md、README、LICENSE 一类文件不可能让门禁失败，
# 跑一遍是纯烧 runner 时间。与 package-smoke.yml 的取舍一致（那边注释写的是
# "避免每次改文档都烧 20 分钟的 Windows runner"）。
#
# 刻意**不**列入 ignored 的路径（宁可多跑一次）：
#   docs/Releases/**  —— 是打包 spec 与资源，构建输入，不是文档；
#   .github/workflows/** —— 工作流自身改动必须验证，否则改坏一次会静默失去所有门禁；
#   tools/** 与 tests/** —— 门禁与被测代码本身。
# 另外「只改注释/格式」的代码改动无法按路径识别，只能照常跑（跑一遍最省心）。
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

# 同一分支的新推送取消旧的运行，省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint（ruff + 规范 + 版本 + 测试/图标）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: ruff（全量，含 E9/F 语法与未定义名字）
        run: python -m ruff check .

      - name: ruff format 差异（仅报告，不作为门禁）
        continue-on-error: true
        run: python -m ruff format --check .

      - name: 插件规范检查
        run: python tools/check_plugins.py

      - name: 打包规则检查（spec 与数据收集）
        run: python tools/check_packaging.py

      - name: 版本一致性（pyproject / package.json）
        run: python tools/check_version.py

      - name: 图标 sprite 一致性（sprite ↔ icon_data ↔ 引用）
        run: python tools/build_icons.py --check

      - name: 测试文件可运行性（tests/test_*.py 必须真的有用例）
        run: python tools/check_tests.py

  typecheck:
    name: typecheck（pyright，内核硬门禁）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖（pyright 需要能解析 flask/PIL/webview）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # 内核（main.py / shell / tools）当前为 0 错误，作为硬门禁：
      # 任何新增的类型错误都必须当场修掉。
      - name: pyright（内核，零错误门禁）
        run: python -m pyright main.py shell tools

      # 插件与测试的类型错误尚未清零，先全量输出供逐步收敛，不拦截合并。
      # 收紧步骤：把插件修到 0 后，把这一步改成不 continue-on-error。
      - name: pyright（插件 + 测试，基线，不拦截）
        continue-on-error: true
        run: python -m pyright plugins tests

  test:
    name: test（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: 单元测试（全量）
        run: python -m unittest discover -s tests -v

      - name: 运行时禁止 print 门禁（发行版 console=False）
        run: python -m unittest tests.test_no_print_in_runtime -v

  frontend:
    name: frontend（转义门禁 + 类型 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      # audit 门禁是 Python 脚本（只用到标准库），显式装一遍而不是赌 runner 自带的 python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 前端转义一致性（属性注入门禁）
        run: node tools/check_frontend_escape.cjs

      - name: 安装依赖（npm ci：按锁文件可复现）
        run: npm --prefix shell/frontend ci

      - name: 依赖漏洞门禁（npm audit，显式走官方 registry）
        # 本机默认 registry 是 npmmirror，它不实现 audit 端点 —— 直接 npm audit 只会
        # 得到 NOT_IMPLEMENTED，等于这个仓库从来没检查过漏洞。脚本内部固定官方源。
        run: python tools/check_npm_audit.py

      - name: 类型检查与构建（vue-tsc --noEmit && vite build）
        run: npm --prefix shell/frontend run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: shell/frontend/dist
          retention-days: 7

  package:
    name: package（PyInstaller 冒烟 + 产物校验，${{ matrix.os }}）
    needs: [lint, frontend]
    # 打包不在每次 push / PR 上跑：省掉 Linux + Windows 两个 runner 与约 100s 墙钟
    # （日常 push 由 9 个 job 降到 7 个）。覆盖率没有丢：
    #   - 改到打包相关文件（docs/Releases/**、requirements*.txt、pyproject.toml、
    #     tools/check_packaging.py、tools/check_build_tree.py）时，package-smoke.yml
    #     会在 PR 与 main/develop push 上按路径触发，跑的是同一套双平台 PyInstaller
    #     + check_build_tree.py 产物校验；
    #   - 进主干（push main）或手动触发时，这里再各跑一次，作为"改应用代码把打包
    #     悄悄改坏"（例如新增 PyInstaller 看不见的导入）的最后一道闸。
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: docs/Releases/omnibox.spec
            dist: .build-dist
            expect_exe: OmniBox.exe
          - os: ubuntu-latest
            spec: docs/Releases/omnibox-linux.spec
            dist: .build-dist
            expect_exe: OmniBox.bin
    steps:
      - uses: actions/checkout@v4

      # Windows 走 setup-python；Linux 用发行版 python3 + venv —— setup-python 那份
      # libpython 与打包产物不兼容：产物启动时报
      # "Failed to load Python shared library .../libpython3.12.so.1.0"（详见 release.yml
      # build job 的注释）。venv 的 bin 追加到 GITHUB_PATH，后续 `python` 就是它。
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Linux 构建前置（发行版 Python + venv + binutils）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip binutils
          # venv 放在工作区**外面**：放进仓库会被 ruff 之类的工具当成源码扫到
          # （extend-exclude 里没有 .venv-build，实测 verify 的 ruff 直接炸掉）。
          python3 -m venv "$RUNNER_TEMP/omnibox-build-venv"
          echo "$RUNNER_TEMP/omnibox-build-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # spec 现在会在缺少前端产物时硬失败；这里按发布路径真实构建一次前端。
      - name: 构建前端（发布路径）
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: PyInstaller 打包
        run: >-
          python -m PyInstaller
          --workpath .build-work
          --distpath ${{ matrix.dist }}
          --noconfirm
          --log-level WARN
          ${{ matrix.spec }}

      - name: 校验产物内容
        run: >-
          python tools/check_build_tree.py
          ${{ matrix.dist }}/OmniBox
          --expect-exe ${{ matrix.expect_exe }}

      - name: 上传产物（供人工验证，非发布）
        uses: actions/upload-artifact@v4
        with:
          name: omnibox-preview-${{ matrix.os }}
          path: ${{ matrix.dist }}/OmniBox
          retention-days: 7
