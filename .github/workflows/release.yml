name: release

# 发布流程（**半自动：自动构建，人工公开**）
#
#   推一个 v* tag  →  校验版本 + 全量门禁  →  双平台构建  →  建【草稿】Release
#                                                              │
#                                        你在 Releases 页面核对 → 点 Publish → 才对外可见
#
# 也就是说：打 tag = "我决定发这个版本"，会触发全量构建并建好草稿（产物已挂上），
# 但**公开仍然是独立的一下**（草稿只有有写权限的人能看见，不进 Releases 列表、
# 不产生 latest、不发通知）。已发布过的 Release 不会被静默覆盖。
#
# 想只构建、连草稿都不建（例如先把 Linux 产物取下来自己核对），用手动触发的
# dry_run：产物以 artifact 形式留在本次运行里（7 天过期）。
#
# 前置约定：
#   1. 版本号唯一来源是 pyproject.toml 的 [project].version，
#      shell/frontend/package.json 与 package-lock.json（两处副本）必须与它一致
#      （tools/check_version.py 会把关）；
#   2. tag 必须写成 v<version>，且与**它指向提交**里的 pyproject.toml 一致，
#      否则第一步就失败，不会产出"名字与版本不符"的安装包；
#   3. tag 指向的提交必须已经在 main 上（见 verify 的 guard 步骤）：避免给
#      还没进主干、没经过 CI 的提交发版；
#   4. 构建前工作区会切到该 tag，不会拿分支的代码发 tag 的名。
#
# 首次使用需要在仓库设置里确认：Settings → Actions → General →
# Workflow permissions 选择 "Read and write permissions"（创建 Release 需要）。
on:
  push:
    tags:
      - 'v*'
  # 手动兜底：重跑某次发布、或只跑 dry_run 取产物。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag（如 v1.2.0，必须已存在、在 main 上、且与 pyproject 版本一致）'
        required: true
        type: string
      dry_run:
        description: '只构建并上传 artifact，连草稿 Release 也不建'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  verify:
    name: 校验版本与测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      # 构建源必须是 tag 指向的提交：tag push 用 github.ref（就是该 tag），
      # 手动触发用输入的 tag。不存在会在这里直接失败。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # verify 固定在 ubuntu-latest：这里只用发行版 python3 + venv，与下面 build job
      # 的 Linux 分支同一套（原因见 build job 里那段注释：setup-python 的 libpython
      # 与打包产物不兼容）。原先这里还留着一个 `if: runner.os == 'Windows'` 的
      # setup-python 步骤 —— 该条件在 ubuntu-only 的 job 里永远不成立，已删除。

      # Linux 构建必须用发行版 Python：setup-python 那份 libpython 与本 spec 不兼容，
      # 产物启动即失败（Failed to load Python shared library .../libpython3.12.so.1.0）。
      # 成因：那份 Python 会让 PyInstaller 把 _struct/_zlib 嵌进 exe，bootloader 于是按
      # onefile 去 /tmp/_MEIxxx 找 libpython；即使找到，libpython 初始化 struct 也会
      # 报 "Module object for struct is NULL!"。发行版 python3.12 + venv 实测产物正常。
      # 把 venv 的 bin 追加到 GITHUB_PATH，后续步骤里的 `python` 自动就是它。
      - name: Linux 构建前置（发行版 Python + venv + binutils）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip binutils
          # venv 放在工作区**外面**：放进仓库会被 ruff 之类的工具当成源码扫到
          # （extend-exclude 里没有 .venv-build，实测 verify 的 ruff 直接炸掉）。
          python3 -m venv "$RUNNER_TEMP/cubby-build-venv"
          echo "$RUNNER_TEMP/cubby-build-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 本次发布 tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次发布 tag: $tag"

      # 只给"已进主干"的提交发版：分支上随手打的 tag 在这里就拦住，
      # 避免出现"用户装到的版本比 main 更超前/没跑过 CI"。
      - name: guard：tag 必须落在 main 上
        run: |
          set -euo pipefail
          tag="${{ steps.ref.outputs.tag }}"
          # 显式 refspec：不依赖 remote.origin.fetch 的配置，确保 origin/main 一定存在。
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          target="$(git rev-list -n1 "refs/tags/${tag}")"
          if git merge-base --is-ancestor "$target" refs/remotes/origin/main; then
            echo "OK：${tag}（${target}）在 main 上"
          else
            echo "::error::tag ${tag}（${target}）不在 main 上：先合并进 main 再发版"
            exit 1
          fi

      - name: 版本一致性（tag ↔ pyproject ↔ package.json）
        run: python tools/check_version.py "${{ steps.ref.outputs.tag }}"

      - name: 输出版本号
        id: version
        run: |
          ver=$(python tools/check_version.py --print)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "version=$ver"

      - name: ruff
        run: python -m ruff check .

      - name: 插件规范检查
        run: python tools/check_plugins.py

      - name: 打包规则检查
        run: python tools/check_packaging.py

      - name: 图标 sprite 一致性
        run: python tools/build_icons.py --check

      - name: 测试文件可运行性
        run: python tools/check_tests.py

      # 与 ci.yml 的 test job 同因：壳首页（/、/settings、插件路由）由
      # shell/frontend/dist/index.html 提供，serve_shell 在它缺失时直接 404；而
      # dist/ 在 .gitignore 里，不构建就有 7 个用例（tests/test_file_server_shell_state.py）
      # 拿不到首页 —— v1.3.2 的发布就卡在这一步。
      - name: 构建前端（壳首页的提供来源）
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: 单元测试
        run: python -m unittest discover -s tests

      - name: 前端转义门禁
        run: node tools/check_frontend_escape.cjs

  build:
    name: 构建 ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: docs/Releases/cubby.spec
            artifact: Cubby-windows-x64.zip
            expect_exe: Cubby.exe
          - os: ubuntu-latest
            spec: docs/Releases/cubby-linux.spec
            artifact: Cubby-linux-x64.tar.gz
            # 注意：发布产物统一叫 Cubby —— 下面的 Linux 步骤会把 PyInstaller 产出的
            # Cubby.bin 重命名掉，所以这里校验的是重命名后的名字（此前写成
            # Cubby.bin，导致校验必然失败）。
            expect_exe: Cubby
    steps:
      # 与 verify 一致：产物必须来自 tag 指向的提交。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      # Windows 走 setup-python；Linux 刻意改用发行版 python3 + venv（原因见下一段）。
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Linux 构建必须用发行版 Python：setup-python 那份 libpython 与本 spec 不兼容，
      # 产物启动即失败（Failed to load Python shared library .../libpython3.12.so.1.0）。
      # 成因：那份 Python 会让 PyInstaller 把 _struct/_zlib 嵌进 exe，bootloader 于是按
      # onefile 去 /tmp/_MEIxxx 找 libpython；即使找到，libpython 初始化 struct 也会
      # 报 "Module object for struct is NULL!"。发行版 python3.12 + venv 实测产物正常。
      # 把 venv 的 bin 追加到 GITHUB_PATH，后续步骤里的 `python` 自动就是它。
      - name: Linux 构建前置（发行版 Python + venv + binutils）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip binutils
          # venv 放在工作区**外面**：放进仓库会被 ruff 之类的工具当成源码扫到
          # （extend-exclude 里没有 .venv-build，实测 verify 的 ruff 直接炸掉）。
          python3 -m venv "$RUNNER_TEMP/cubby-build-venv"
          echo "$RUNNER_TEMP/cubby-build-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 构建前端
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: PyInstaller 打包
        run: >-
          python -m PyInstaller
          --workpath .build-work
          --distpath .build-dist
          --noconfirm
          --log-level WARN
          ${{ matrix.spec }}

      - name: Linux：重命名可执行文件
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -f .build-dist/Cubby/Cubby.bin
          mv .build-dist/Cubby/Cubby.bin .build-dist/Cubby/Cubby
          chmod +x .build-dist/Cubby/Cubby

      - name: 校验产物内容
        run: >-
          python tools/check_build_tree.py
          .build-dist/Cubby
          --expect-exe ${{ matrix.expect_exe }}

      - name: 生成依赖快照（审计用）
        continue-on-error: true
        run: python -m pip freeze > .build-dist/Cubby/requirements.lock.txt

      - name: 打包（Windows → zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path .build-dist/Cubby/* -DestinationPath "${{ matrix.artifact }}" -CompressionLevel Optimal
          Get-Item "${{ matrix.artifact }}" | Select-Object Name, Length

      - name: 打包（Linux → tar.gz）
        if: runner.os == 'Linux'
        run: |
          tar -C .build-dist -czf "${{ matrix.artifact }}" Cubby
          ls -lh "${{ matrix.artifact }}"

      - name: 生成校验和
        run: python -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(hashlib.sha256(p.read_bytes()).hexdigest(), p.name)" "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      # ── Windows 安装器（Inno Setup）────────────────────────────────────────
      # 为什么 per-user（PrivilegesRequired=lowest）：安装位置与用户数据都在
      # 当前用户目录下（%LOCALAPPDATA%），免管理员权限即可安装与覆盖升级，
      # 发布链因此不需要任何提权步骤，也不会把文件写进 Program Files。
      # 为什么放在依赖快照之后编译：安装器铺的是同一个 .build-dist/Cubby，
      # requirements.lock.txt 在那一步才写进去，这样它与 zip 里的内容一致。
      - name: 安装 Inno Setup（并定位 iscc）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # 不能假设 iscc 在 PATH 上：choco 装的是机器级 PATH，当前进程读不到；
          # choco 的 shim 也可能落在别的目录。先按命令找，再按默认安装位置找，
          # 都找不到就失败 —— 静默跳过只会得到一个"没编出安装器"的绿。
          $candidates = @()
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $candidates += "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw "choco 已安装 innosetup，但没有找到 ISCC.exe；试过 PATH、${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe、$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC: $iscc"

      - name: 编译 Windows 安装器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $sourceDir = Join-Path $repo '.build-dist\Cubby'
          $outputDir = Join-Path $repo '.build-dist'
          $version = '${{ needs.verify.outputs.version }}'
          & $env:ISCC "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/O$outputDir" 'docs/Releases/cubby.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC 编译失败（退出码 $LASTEXITCODE）：docs/Releases/cubby.iss"
          }
          $setup = Join-Path $outputDir "Cubby-Setup-$version.exe"
          if (-not (Test-Path $setup)) {
            throw "ISCC 报告成功，但没有产出 $setup（核对 cubby.iss 的 OutputBaseFilename 与 /O 参数）"
          }
          Get-Item $setup | Select-Object Name, Length

      # 与上面的产物校验和同一行命令、同一格式（<hex> <文件名>）。
      - name: 生成安装器校验和
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(hashlib.sha256(p.read_bytes()).hexdigest(), p.name)" ".build-dist/Cubby-Setup-${{ needs.verify.outputs.version }}.exe" > ".build-dist/Cubby-Setup-${{ needs.verify.outputs.version }}.exe.sha256"

      # 为什么必须有冒烟：ISCC 编译通过只证明脚本语法与文件列表成立；
      # "装完目标目录里有 Cubby.exe""卸载器能静默退出 0"是用户第一步就会踩到的
      # 路径，只有真机装一次才能证明。失败必须让 job 红，不能只打印。
      - name: 静默安装 / 卸载冒烟
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Join-Path (Get-Location).Path ".build-dist\Cubby-Setup-${{ needs.verify.outputs.version }}.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'cubby-setup-smoke'
          $log = Join-Path $env:RUNNER_TEMP 'cubby-setup-install.log'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/DIR=`"$dir`"", "/LOG=`"$log`""
          )
          if ($install.ExitCode -ne 0) {
            throw "静默安装失败，退出码 $($install.ExitCode)（日志：$log）"
          }
          $exe = Join-Path $dir 'Cubby.exe'
          if (-not (Test-Path $exe)) {
            throw "静默安装后目标目录里没有 Cubby.exe：$dir"
          }
          $uninst = Join-Path $dir 'unins000.exe'
          if (-not (Test-Path $uninst)) {
            throw "静默安装后目标目录里没有 unins000.exe：$dir"
          }
          $uninstall = Start-Process -FilePath $uninst -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          )
          if ($uninstall.ExitCode -ne 0) {
            throw "静默卸载失败，退出码 $($uninstall.ExitCode)"
          }
          # Inno 的卸载器会把自己复制到临时目录再执行，父进程可能先返回 0；
          # 只认退出码会漏掉"报成功但什么都没删"，所以再等安装目录真的消失。
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and ((Get-Date) -lt $deadline)) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $exe) {
            throw "静默卸载返回 0，但安装目录里仍有 Cubby.exe：$dir"
          }
          Write-Host '安装 / 卸载冒烟通过'

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

      # 安装器单独一个 artifact：同一个 upload-artifact 步骤的 path 列表对所有
      # 平台生效，无法只给 Windows 追加入口；publish job 用 merge-multiple: true
      # 合并全部 artifact，多一个名字不影响 dist/* 的收集。
      - name: 上传 Windows 安装器
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Cubby-Setup-windows-x64
          path: |
            .build-dist/Cubby-Setup-${{ needs.verify.outputs.version }}.exe
            .build-dist/Cubby-Setup-${{ needs.verify.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 建草稿 Release（等人点 Publish）
    needs: [verify, build]
    # dry_run 只构建不发：产物留在本次运行的 artifact 里，连草稿都不建。
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      # 用 gh CLI（ubuntu runner 预装），不再额外引入第三方 action 以缩小供应链面。
      # 三种情况分开处理：草稿→覆盖刷新；已发布→明确拒绝（不静默替换别人已下载的产物）；不存在→建草稿。
      - name: 创建 / 刷新草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          notes="Cubby ${VERSION}

          - 版本号：\`${VERSION}\`
          - 产物（三类，各自附带 \`.sha256\`）：
            - Windows 安装器（推荐）：\`Cubby-Setup-${VERSION}.exe\`，按当前用户安装，不需要管理员权限
            - Windows 便携版：\`Cubby-windows-x64.zip\`，解压即用
            - Linux 便携版：\`Cubby-linux-x64.tar.gz\`，解压即用
          - 构建来源：${RUN_URL}

          校验下载完整性：
          \`\`\`powershell
          # Windows：安装器与便携 zip 同理，换成对应文件名即可
          # 输出的 Hash 应与 .sha256 文件里的十六进制串一致
          Get-FileHash -Algorithm SHA256 .\Cubby-Setup-${VERSION}.exe
          \`\`\`

          \`\`\`bash
          # Linux
          sha256sum -c Cubby-linux-x64.tar.gz.sha256
          \`\`\`
          "
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            true)
              echo "Release $TAG 已是草稿：覆盖上传产物并刷新说明"
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --title "$TAG" --notes "$notes"
              ;;
            false)
              echo "::error::Release $TAG 已经发布过，拒绝覆盖已公开的产物；要重发请先删除该 Release 或换版本号"
              exit 1
              ;;
            *)
              echo "创建草稿 Release $TAG（产物已挂好，等你在 Releases 页面核对后点 Publish）"
              gh release create "$TAG" dist/* --draft --title "$TAG" --notes "$notes"
              ;;
          esac
          echo "本次运行的产物同时留在 workflow artifact 里（7 天），需要先人工验证可从该运行页面下载。"
