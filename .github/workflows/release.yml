name: release

# 发布流程（**半自动：自动构建，人工公开**）
#
#   推一个 v* tag  →  校验版本 + 全量门禁  →  双平台构建  →  建【草稿】Release
#                                                              │
#                                        你在 Releases 页面核对 → 点 Publish → 才对外可见
#
# 也就是说：打 tag = "我决定发这个版本"，会触发全量构建并建好草稿（产物已挂上），
# 但**公开仍然是独立的一下**（草稿只有有写权限的人能看见，不进 Releases 列表、
# 不产生 latest、不发通知）。已发布过的 Release 不会被静默覆盖。
#
# 想只构建、连草稿都不建（例如先把 Linux 产物取下来自己核对），用手动触发的
# dry_run：产物以 artifact 形式留在本次运行里（7 天过期）。
#
# 前置约定：
#   1. 版本号唯一来源是 pyproject.toml 的 [project].version，
#      shell/frontend/package.json 与 package-lock.json（两处副本）必须与它一致
#      （tools/check_version.py 会把关）；
#   2. tag 必须写成 v<version>，且与**它指向提交**里的 pyproject.toml 一致，
#      否则第一步就失败，不会产出"名字与版本不符"的安装包；
#   3. tag 指向的提交必须已经在 main 上（见 verify 的 guard 步骤）：避免给
#      还没进主干、没经过 CI 的提交发版；
#   4. 构建前工作区会切到该 tag，不会拿分支的代码发 tag 的名。
#
# 首次使用需要在仓库设置里确认：Settings → Actions → General →
# Workflow permissions 选择 "Read and write permissions"（创建 Release 需要）。
on:
  push:
    tags:
      - 'v*'
  # 手动兜底：重跑某次发布、或只跑 dry_run 取产物。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag（如 v1.2.0，必须已存在、在 main 上、且与 pyproject 版本一致）'
        required: true
        type: string
      dry_run:
        description: '只构建并上传 artifact，连草稿 Release 也不建'
        required: false
        default: false
        type: boolean

# 权限最小化：整条工作流只需要读仓库；唯一写仓库的动作是 publish job 里建/刷新
# Release，写权限写在那一个 job 上（verify 与 build 会跑 pip install / npm ci /
# PyInstaller，不给它们可推送 contents 的 token）。
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  verify:
    name: 校验版本与测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      # 构建源必须是 tag 指向的提交：tag push 用 github.ref（就是该 tag），
      # 手动触发用输入的 tag。不存在会在这里直接失败。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # verify 固定在 ubuntu-latest：这里只用发行版 python3 + venv，与下面 build job
      # 的 Linux 分支同一套（原因见 build job 里那段注释：setup-python 的 libpython
      # 与打包产物不兼容）。原先这里还留着一个 `if: runner.os == 'Windows'` 的
      # setup-python 步骤 —— 该条件在 ubuntu-only 的 job 里永远不成立，已删除。

      # Linux 构建必须用发行版 Python：setup-python 那份 libpython 与本 spec 不兼容，
      # 产物启动即失败（Failed to load Python shared library .../libpython3.12.so.1.0）。
      # 成因：那份 Python 会让 PyInstaller 把 _struct/_zlib 嵌进 exe，bootloader 于是按
      # onefile 去 /tmp/_MEIxxx 找 libpython；即使找到，libpython 初始化 struct 也会
      # 报 "Module object for struct is NULL!"。发行版 python3.12 + venv 实测产物正常。
      # 把 venv 的 bin 追加到 GITHUB_PATH，后续步骤里的 `python` 自动就是它。
      - name: Linux 构建前置（发行版 Python + venv + binutils）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip binutils
          # venv 放在工作区**外面**：放进仓库会被 ruff 之类的工具当成源码扫到
          # （extend-exclude 里没有 .venv-build，实测 verify 的 ruff 直接炸掉）。
          python3 -m venv "$RUNNER_TEMP/cubby-build-venv"
          echo "$RUNNER_TEMP/cubby-build-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 本次发布 tag
        id: ref
        # dispatch 的输入不拼进脚本：经 env 传，tag 里带引号/$(...) 也只是数据。
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次发布 tag: $tag"

      # 只给"已进主干"的提交发版：分支上随手打的 tag 在这里就拦住，
      # 避免出现"用户装到的版本比 main 更超前/没跑过 CI"。
      - name: guard：tag 必须落在 main 上
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          # 显式 refspec：不依赖 remote.origin.fetch 的配置，确保 origin/main 一定存在。
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          target="$(git rev-list -n1 "refs/tags/${TAG}")"
          if git merge-base --is-ancestor "$target" refs/remotes/origin/main; then
            echo "OK：${TAG}（${target}）在 main 上"
          else
            echo "::error::tag ${TAG}（${target}）不在 main 上：先合并进 main 再发版"
            exit 1
          fi

      - name: 版本一致性（tag ↔ pyproject ↔ package.json）
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: python tools/check_version.py "$TAG"

      - name: 输出版本号
        id: version
        run: |
          ver=$(python tools/check_version.py --print)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "version=$ver"

      - name: ruff
        run: python -m ruff check .

      - name: 插件规范检查
        run: python tools/check_plugins.py

      - name: 打包规则检查
        run: python tools/check_packaging.py

      - name: 图标 sprite 一致性
        run: python tools/build_icons.py --check

      # 图标是逐字节比对（不读字体，ubuntu 上可跑），与 lint 一致。
      # 向导图的逐字节比对要 Windows 系统字体，且不同镜像渲染出的字节不同，因此不在 CI 里做：
      # 形态（存在 / 可解码 / 尺寸）由 lint 的 --check-banners 负责，逐字节留给本地 --check。
      - name: 应用图标一致性（不读字体）
        run: python tools/build_brand.py --check-icons

      - name: 测试文件可运行性
        run: python tools/check_tests.py

      # 与 ci.yml 的 test job 同因：壳首页（/、/settings、插件路由）由
      # shell/frontend/dist/index.html 提供，serve_shell 在它缺失时直接 404；而
      # dist/ 在 .gitignore 里，不构建就有 7 个用例（tests/test_file_server_shell_state.py）
      # 拿不到首页 —— v1.3.2 的发布就卡在这一步。
      - name: 构建前端（壳首页的提供来源）
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: 单元测试
        run: python -m unittest discover -s tests

      - name: 前端转义门禁
        run: node tools/check_frontend_escape.cjs

  build:
    name: 构建 ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: docs/Releases/cubby.spec
            artifact: Cubby-windows-x64.zip
            expect_exe: Cubby.exe
          - os: ubuntu-latest
            spec: docs/Releases/cubby-linux.spec
            artifact: Cubby-linux-x64.tar.gz
            # 注意：发布产物统一叫 Cubby —— 下面的 Linux 步骤会把 PyInstaller 产出的
            # Cubby.bin 重命名掉，所以这里校验的是重命名后的名字（此前写成
            # Cubby.bin，导致校验必然失败）。
            expect_exe: Cubby
    steps:
      # 与 verify 一致：产物必须来自 tag 指向的提交。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      # 两个平台都用 setup-python：Linux 的**构建**在容器里做（见下面的 PyInstaller 步骤），
      # 宿主这份 Python 只服务工具脚本（check_build_tree / sha256 / pip freeze）。
      # 历史约束仍在：不能用 setup-python 那份 libpython 去构建 Linux 产物 —— 产物启动报
      # "Failed to load Python shared library .../libpython3.12.so.1.0"，因为 PyInstaller
      # 会把 _struct/_zlib 嵌进 exe，bootloader 按 onefile 去找 libpython。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 构建前端
        run: |
          npm --prefix shell/frontend ci
          npm --prefix shell/frontend run build

      - name: PyInstaller 打包（Windows）
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller
          --workpath .build-work
          --distpath .build-dist
          --noconfirm
          --log-level WARN
          ${{ matrix.spec }}

      # Linux 产物在 debian:12 容器里构建：PyInstaller 不打包 glibc，产物继承构建机的
      # 基线。ubuntu-latest 是 24.04（glibc 2.39），在它上面构建出的 tar.gz 到
      # Debian 12 / DSM 7 / TrueNAS SCALE（glibc 2.36）上会报
      # "version `GLIBC_2.36' not found"（已实测）。debian:12 的 python3 是 3.11，
      # 满足 requires-python；前端在宿主机构建后经挂载点进容器，容器里不需要 node。
      #
      # 桌面窗口的 Python 绑定也在这里编译（见下面的 PyGObject 安装）：冻结进产物的
      # CPython 就是容器里的 python3，绑定必须在同一份解释器上编译才有 ABI 一致性。
      - name: PyInstaller 打包（Linux，debian:12 容器）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # build-essential / ninja-build：PyGObject 与 pycairo 只有源码包，pip 的
            # build isolation 只装 meson 与 meson-python，编译器与 ninja 得由系统提供
            # （debian:12 基础镜像两者都没有）。
            # python3-dev / pkg-config / libgirepository1.0-dev / libcairo2-dev 是编译
            # 所需的头文件与 pkg-config 描述；gir1.2-* 装上 GTK/WebKit2 的 typelib 与
            # 运行库，让构建机里的 gi 能解析版本（运行时这些一律由用户系统提供，
            # 不进产物）。bookworm 自带 gir1.2-webkit2-4.1（无需退回 4.0）。
            apt-get install -y -qq python3 python3-venv python3-pip binutils \
              build-essential ninja-build pkg-config python3-dev \
              libgirepository1.0-dev libcairo2-dev \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.1
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q --upgrade pip
            /tmp/venv/bin/pip install -q -r requirements-dev.txt
            # PyGObject 只有源码包，pip 会现场用 meson 编译（上面装的那些 -dev 包）。
            # 固定 3.48.2：bookworm 的 glib 是 2.74、gobject-introspection 是 1.74，
            # 3.48.x 仍走 girepository-1.0（meson 要求 glib >= 2.64 / gi >= 1.64）。
            # 不能上 3.50：它改用 girepository-2.0，而 girepository 2.0 已并入 glib，
            # 要求 glib >= 2.80，在 bookworm 上编译不过。
            /tmp/venv/bin/pip install -q "PyGObject==3.48.2"
            /tmp/venv/bin/python -m PyInstaller --workpath .build-work --distpath .build-dist --noconfirm --log-level WARN docs/Releases/cubby-linux.spec
            mv -f .build-dist/Cubby/Cubby.bin .build-dist/Cubby/Cubby
            chmod +x .build-dist/Cubby/Cubby
            # 发布包里的"只跑 HTTP 服务"启动器随 datas 进来，datas 拷贝不保留可执行位
            chmod +x .build-dist/Cubby/cubby-web.sh
            # 依赖快照写到产物目录树之外：tar -C .build-dist Cubby 只收 Cubby/，写进
            # Cubby/ 就会被一起分发。它只用于审计构建环境（含 pyright/ruff/pyinstaller
            # 这类构建依赖），不能随包分发；同时打进日志供从运行页面复核。
            /tmp/venv/bin/pip freeze > .build-dist/requirements.lock.txt
            echo "--- requirements.lock.txt（仅审计，不随包分发）---"
            cat .build-dist/requirements.lock.txt
          '

      - name: 校验产物内容
        run: >-
          python tools/check_build_tree.py
          .build-dist/Cubby
          --expect-exe ${{ matrix.expect_exe }}

      # 只断言"文件齐全"证明不了动态链接：真的在目标发行版里起一次 --web-only，
      # 再由容器内的 python3 发一次 HTTP GET /health 并等 200 才算过（它在
      # _OPEN_ENDPOINTS 里，不需要令牌）。debian:12 基础镜像没有 curl，所以先装 python3。
      # 只连端口不算数：服务绑上了端口但 /health 返回 500 也是坏的。
      # 这里刻意**通过发布包里的 cubby-web.sh 启动**（而不是直接跑可执行文件）：
      # 启动器本身也是产物，路径解析与参数透传坏了必须在这里暴露。
      - name: Linux 产物在 debian:12 里起得来且 /health 返回 200
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.build-dist/Cubby:/srv/Cubby:ro" -e CUBBY_HOME=/tmp/cubby-home debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq python3 >/dev/null
            cd /srv/Cubby
            ./cubby-web.sh --port 18080 >/tmp/cubby.log 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 40); do
              # 真的发 HTTP GET：连得上端口只说明进程在听，/health 返回非 2xx 同样算失败。
              if python3 -c "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen(sys.argv[1], timeout=2).status == 200 else 1)" "http://127.0.0.1:18080/health" >/tmp/health.log 2>&1; then ok=1; break; fi
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$ok" != 1 ]; then
              echo "::error::产物在 debian:12 里没有起来，或 /health 没有返回 200"
              tail -20 /tmp/cubby.log
              echo "--- /health 探测输出 ---"
              tail -5 /tmp/health.log 2>/dev/null || true
              exit 1
            fi
            echo "产物在 debian:12 里启动，且 /health 返回 200"
          '

      # 能起 --web-only 不代表能开窗：Linux 桌面窗口走 pywebview 的 GTK 后端，
      # 需要系统 WebKitGTK 与 X 显示。这里装 Xvfb 与系统 WebKitGTK，用 xvfb-run
      # 起一次真实窗口；main.py 的冒烟钩子在 CUBBY_WINDOW_SMOKE_MS 毫秒后自动关窗，
      # 所以进程应当自己以 0 退出。断言两条：超时时间内退出码为 0、日志里出现建窗
      # 成功那一行。缺 WebKitGTK 时进程会降级到 --web-only 一直服务，被 timeout 杀掉，
      # 两条断言都会失败。容器里没有 curl，判据只用 coreutils 与产物自身的日志。
      - name: Linux 产物在 debian:12 里开得起 GTK 窗口
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.build-dist/Cubby:/srv/Cubby:ro" -e CUBBY_HOME=/tmp/cubby-home debian:12 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            # xvfb / xauth 提供虚拟显示；dbus-x11 提供会话总线的启动器（GTK 缺它会告警）；
            # 系统 WebKitGTK 与 GTK 的 typelib 是运行时依赖，产物里只有 Python 绑定。
            apt-get install -y -qq xvfb xauth dbus-x11 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 gir1.2-gtk-3.0 >/dev/null
            export HOME=/tmp/cubby-home
            export XDG_RUNTIME_DIR=/tmp/xdg-runtime
            mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            # Xvfb 没有 GPU：WebKitGTK 2.42 起默认的 DMA-BUF 渲染器在无 GPU 环境会失败，
            # 显式走软件渲染路径。这只改合成方式，窗口本身仍由系统的 GTK 创建。
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export LIBGL_ALWAYS_SOFTWARE=1
            export CUBBY_WINDOW_SMOKE_MS=8000
            status=0
            timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" /srv/Cubby/Cubby --port 18081 >/tmp/window.log 2>&1 || status=$?
            if [ "$status" != 0 ]; then
              echo "::error::Linux 产物没能开窗：进程退出码 $status（124 表示超时，通常是降级成 --web-only 一直服务）"
              tail -40 /tmp/window.log
              exit 1
            fi
            if ! grep -Fq "[Cubby] 桌面窗口已创建" /tmp/window.log; then
              echo "::error::Linux 产物日志里没有建窗成功那一行，窗口没有真正创建"
              tail -40 /tmp/window.log
              exit 1
            fi
            echo "Linux 产物在 debian:12 + Xvfb 里创建了 GTK 窗口，并按冒烟钩子自行退出"
          '

      # 发布包里的 Cubby-Web.cmd 是 Windows 上唯一"只跑 HTTP 服务"的入口（不加开始菜单
      # 快捷方式、不提供 .ps1）。除了文件存在，这里还真跑一次：启动 → 轮询 /health →
      # taskkill 整棵树，确认脚本把参数透传给了主程序（--port 生效），而不是只声明了文件。
      - name: Windows 产物里的 web-only 启动器可用
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Join-Path '.build-dist/Cubby' 'Cubby-Web.cmd'
          if (-not (Test-Path -LiteralPath $launcher)) {
            Write-Error "产物里没有 Cubby-Web.cmd"
            exit 1
          }
          # 用户数据根放到 runner 临时目录，别把设置写进产物目录
          $env:CUBBY_HOME = Join-Path $env:RUNNER_TEMP 'cubby-home'
          $proc = Start-Process -FilePath $launcher -ArgumentList '--port', '18090' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                # -NoProxy：CI 环境里的 HTTP(S)_PROXY 会让本机探活被交给代理
                $resp = Invoke-WebRequest -NoProxy -UseBasicParsing -Uri 'http://127.0.0.1:18090/health' -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ok) {
              Write-Error "Cubby-Web.cmd 启动后 /health 没有返回 200"
              exit 1
            }
            Write-Output 'Cubby-Web.cmd 启动成功，/health 返回 200'
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              # /T 连子进程一起杀：cmd.exe 下面才是 Cubby.exe
              taskkill /PID $proc.Id /T /F | Out-Null
            }
          }

      # Windows 的依赖快照写在宿主；Linux 那份由构建容器写（记录的才是真正的构建环境）。
      #
      # 两处都写到产物目录树**外**的 .build-dist/：zip 用 Cubby/*、tar 用 -C .build-dist
      # Cubby、安装器 [Files] 是 SourceDir\* 全收 —— 写进 .build-dist/Cubby 就会被一起
      # 分发。这份快照只用于审计构建环境（里面是 pyright / ruff / pyinstaller 之类的
      # 构建与开发依赖），不能随包分发。它同时打进任务日志，保留"从运行页面复核构建
      # 环境"的价值；刻意不单独上传 artifact —— publish 用 dist/* 全收，多传一份会变成
      # Release 资产。
      - name: 生成依赖快照（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build-dist | Out-Null
          python -m pip freeze > .build-dist/requirements.lock.txt
          Write-Output '--- requirements.lock.txt（仅审计，不随包分发）---'
          Get-Content .build-dist/requirements.lock.txt

      - name: 打包（Windows → zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path .build-dist/Cubby/* -DestinationPath "${{ matrix.artifact }}" -CompressionLevel Optimal
          Get-Item "${{ matrix.artifact }}" | Select-Object Name, Length

      - name: 打包（Linux → tar.gz）
        if: runner.os == 'Linux'
        run: |
          tar -C .build-dist -czf "${{ matrix.artifact }}" Cubby
          ls -lh "${{ matrix.artifact }}"

      - name: 生成校验和
        run: python -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(hashlib.sha256(p.read_bytes()).hexdigest(), p.name)" "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      # ── Windows 安装器（Inno Setup）────────────────────────────────────────
      # 编译、校验和与静默安装/卸载冒烟都在 .github/actions/windows-installer 里，
      # 与 package-smoke.yml 共用同一份：安装器的参数与冒烟判据只能有一个出处，
      # 否则"发布链改了、冒烟没改"要等到打 tag 才暴露。
      # 为什么放在依赖快照之后：安装器铺的是同一个 .build-dist/Cubby。锁文件写在产物
      # 树外的 .build-dist/，三者（zip / tar.gz / 安装器）都不带它，因此顺序不影响
      # "安装器与 zip 的目录内容一致"这一条。
      - name: 构建 Windows 安装器
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-installer
        with:
          version: ${{ needs.verify.outputs.version }}
          source-dir: .build-dist/Cubby
          output-dir: .build-dist
          artifact-name: Cubby-Setup-windows-x64

      # zip / tar.gz 走各自的 artifact；安装器由上面那个 composite action 单独上传
      # （同一个 upload-artifact 步骤的 path 列表对所有平台生效，无法只给 Windows
      # 追加入口）。publish job 用 merge-multiple: true 合并全部 artifact 再按
      # dist/* 收集，多一个名字不影响。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 建草稿 Release（等人点 Publish）
    needs: [verify, build]
    # dry_run 只构建不发：产物留在本次运行的 artifact 里，连草稿都不建。
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # 整条工作流只读；写仓库是这一个 job 的事（gh release create/edit/upload）。
    permissions:
      contents: write
    steps:
      # 与 build 一致：上传的仓库内文件（migrate-to-2.0.*）必须取自这次发布的 tag，
      # 不能取默认分支 HEAD —— workflow_dispatch 时两者可能不是一个提交。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      # 用 gh CLI（ubuntu runner 预装），不再额外引入第三方 action 以缩小供应链面。
      # 三种情况分开处理：草稿→覆盖刷新；已发布→明确拒绝（不静默替换别人已下载的产物）；不存在→建草稿。
      - name: 创建 / 刷新草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          notes="Cubby ${VERSION}

          - 版本号：\`${VERSION}\`
          - 产物（三类，各自附带 \`.sha256\`）：
            - Windows 安装器（推荐）：\`Cubby-Setup-${VERSION}.exe\`，按当前用户安装，不需要管理员权限
            - Windows 便携版：\`Cubby-windows-x64.zip\`，解压即用
            - Linux 便携版：\`Cubby-linux-x64.tar.gz\`，解压即用
          - 构建来源：${RUN_URL}
          - 升级：下载 migrate-to-2.0 放到旧版本目录旁运行（默认只预演，加 --apply 落盘）

          校验下载完整性：
          \`\`\`powershell
          # Windows：安装器与便携 zip 同理，换成对应文件名即可
          # 输出的 Hash 应与 .sha256 文件里的十六进制串一致
          Get-FileHash -Algorithm SHA256 .\Cubby-Setup-${VERSION}.exe
          \`\`\`

          \`\`\`bash
          # Linux
          sha256sum -c Cubby-linux-x64.tar.gz.sha256
          \`\`\`
          "
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            true)
              echo "Release $TAG 已是草稿：覆盖上传产物并刷新说明"
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --title "$TAG" --notes "$notes"
              ;;
            false)
              echo "::error::Release $TAG 已经发布过，拒绝覆盖已公开的产物；要重发请先删除该 Release 或换版本号"
              exit 1
              ;;
            *)
              echo "创建草稿 Release $TAG（产物已挂好，等你在 Releases 页面核对后点 Publish）"
              gh release create "$TAG" dist/* --draft --title "$TAG" --notes "$notes"
              ;;
          esac
          # 1.4.0 → 2.0 的迁移脚本作为独立资产挂在同一个 Release 上：草稿与新建两条分支
          # 都会走到这里；已发布分支在上面的 case 里已经 exit 1，照旧拒绝覆盖。
          gh release upload "$TAG" docs/Releases/migrate-to-2.0.cmd docs/Releases/migrate-to-2.0.ps1 --clobber
          echo "本次运行的产物同时留在 workflow artifact 里（7 天），需要先人工验证可从该运行页面下载。"
