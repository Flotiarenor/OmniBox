name: Windows 安装器（Inno Setup）
description: >-
  把已构建好的产物目录用 docs/Releases/cubby.iss 打成 per-user 安装器，生成同名
  .sha256，并做一次静默安装 / 卸载冒烟。release.yml 与 package-smoke.yml 共用这一份：
  安装器的编译参数与冒烟判据只能有一个出处，否则"发布链改了、冒烟没改"这类漂移
  要等到打 tag 才暴露。

inputs:
  source-dir:
    description: 产物目录（仓库相对路径，例如 .build-dist/Cubby）
    required: true
  output-dir:
    description: 安装器输出目录（仓库相对路径，例如 .build-dist）
    required: true
  version:
    description: 安装器版本号；留空则取 tools/check_version.py --print
    required: false
    default: ''
  artifact-name:
    description: 上传的 artifact 名；留空则不上传
    required: false
    default: ''

runs:
  using: composite
  steps:
    # 版本号只有一个来源（pyproject.toml 的 [project].version）：调用方可以传，
    # 不传就用发布链同一个脚本取，两条路径得到的是同一个值。
    - name: 解析版本号
      shell: pwsh
      run: |
        $version = '${{ inputs.version }}'.Trim()
        if (-not $version) {
          $version = ((& python tools/check_version.py --print) | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            throw '拿不到版本号：python tools/check_version.py --print 失败或输出为空'
          }
        }
        "CUBBY_SETUP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "安装器版本: $version"

    # 不能假设 iscc 在 PATH 上：choco 装的是机器级 PATH，当前进程读不到；choco 的
    # shim 也可能落在别的目录。先按命令找，再按默认安装位置找，都找不到就失败 ——
    # 静默跳过只会得到一个"没编出安装器"的绿。
    #
    # 版本固定：cubby.iss 按 Inno Setup 6.7 编写（向导图 PNG 要 6.5.2+，202×386 的
    # 图像区是 6.6+ 的默认值），取"最新"会让安装器的行为随上游漂移。这里固定到
    # 6.7.1 —— choco 社区源目前发布到的最高版（6.7.2 / 6.7.3 上游有、包没有，
    # 指定不存在的版本会让这一步直接失败）。候选目录同时列 6 与 7：包一旦把主版本
    # 升到 7，固定版本装不上时还有一个落点，而不是抛一句"没找到 ISCC.exe"。
    - name: 安装 Inno Setup（并定位 iscc）
      shell: pwsh
      env:
        INNO_SETUP_VERSION: '6.7.1'
      run: |
        choco install innosetup --version=$env:INNO_SETUP_VERSION --allow-downgrade --no-progress -y
        $candidates = @()
        $cmd = Get-Command iscc -ErrorAction SilentlyContinue
        if ($cmd) { $candidates += $cmd.Source }
        foreach ($major in @('7', '6')) {
          $candidates += "${env:ProgramFiles(x86)}\Inno Setup $major\ISCC.exe"
          $candidates += "$env:ProgramFiles\Inno Setup $major\ISCC.exe"
        }
        $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
        if (-not $iscc) {
          throw "choco 已安装 innosetup $env:INNO_SETUP_VERSION，但没有找到 ISCC.exe；试过 PATH 与 Program Files 下的 Inno Setup 6/7 目录"
        }
        "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "ISCC: $iscc"

    - name: 编译安装器
      shell: pwsh
      run: |
        $repo = (Get-Location).Path
        $sourceDir = Join-Path $repo '${{ inputs.source-dir }}'
        $outputDir = Join-Path $repo '${{ inputs.output-dir }}'
        if (-not (Test-Path $sourceDir)) {
          throw "产物目录不存在：$sourceDir（先跑 PyInstaller 与 check_build_tree.py）"
        }
        New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
        $version = $env:CUBBY_SETUP_VERSION
        & $env:ISCC "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/O$outputDir" 'docs/Releases/cubby.iss'
        if ($LASTEXITCODE -ne 0) {
          throw "ISCC 编译失败（退出码 $LASTEXITCODE）：docs/Releases/cubby.iss"
        }
        $setup = Join-Path $outputDir "Cubby-Setup-$version.exe"
        if (-not (Test-Path $setup)) {
          throw "ISCC 报告成功，但没有产出 $setup（核对 cubby.iss 的 OutputBaseFilename 与 /O 参数）"
        }
        Get-Item $setup | Select-Object Name, Length

    # 与 release.yml 里其它产物校验和同一行命令、同一格式（<hex> <文件名>）。
    - name: 生成安装器校验和
      shell: pwsh
      run: |
        $version = $env:CUBBY_SETUP_VERSION
        $setup = Join-Path '${{ inputs.output-dir }}' "Cubby-Setup-$version.exe"
        python -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(hashlib.sha256(p.read_bytes()).hexdigest(), p.name)" "$setup" > "$setup.sha256"
        Get-Content "$setup.sha256"
        # 复制到工作区根目录供上传：upload-artifact v4 默认排除隐藏路径，而
        # .build-dist 是点开头的目录 —— 通配符形式（.build-dist/Cubby-Setup-*.exe）
        # 会在隐藏目录段上被过滤，表现为"文件明明存在却 No files were found"。
        # 放到根目录与 zip 的落点一致，也不依赖那个过滤语义。
        Copy-Item -Path $setup, "$setup.sha256" -Destination (Get-Location).Path -Force
        Get-ChildItem -Path (Get-Location).Path -Filter 'Cubby-Setup-*' | Select-Object Name, Length

    # 为什么必须有冒烟：ISCC 编译通过只证明脚本语法与文件列表成立；
    # "装完目标目录里有 Cubby.exe""卸载器能静默退出 0"是用户第一步就会踩到的路径，
    # 只有真机装一次才能证明。失败必须让 job 红，不能只打印。
    - name: 静默安装 / 升级 / 卸载冒烟
      shell: pwsh
      run: |
        $version = $env:CUBBY_SETUP_VERSION
        $setup = Join-Path (Join-Path (Get-Location).Path '${{ inputs.output-dir }}') "Cubby-Setup-$version.exe"
        $dir = Join-Path $env:RUNNER_TEMP 'cubby-setup-smoke'
        $log = Join-Path $env:RUNNER_TEMP 'cubby-setup-install.log'
        if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }

        # 用户数据哨兵：安装、覆盖安装、卸载三步之后它都必须还在。
        # 只测"装得上、卸得掉"漏掉的是升级路径动到 %LOCALAPPDATA%\Cubby 的回归。
        $dataDir = Join-Path $env:LOCALAPPDATA 'Cubby'
        $sentinel = Join-Path $dataDir 'installer-smoke-sentinel.txt'
        New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
        Set-Content -Path $sentinel -Value 'keep me' -Encoding utf8

        $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
          '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
          "/DIR=`"$dir`"", "/LOG=`"$log`""
        )
        if ($install.ExitCode -ne 0) {
          throw "静默安装失败，退出码 $($install.ExitCode)（日志：$log）"
        }
        $exe = Join-Path $dir 'Cubby.exe'
        if (-not (Test-Path $exe)) {
          throw "静默安装后目标目录里没有 Cubby.exe：$dir"
        }
        $uninst = Join-Path $dir 'unins000.exe'
        if (-not (Test-Path $uninst)) {
          throw "静默安装后目标目录里没有 unins000.exe：$dir"
        }
        if (-not (Test-Path $sentinel)) {
          throw "首次安装后用户数据根里的哨兵文件不见了：$sentinel"
        }

        # 覆盖安装（升级路径）：同一个目录再装一次，数据根不得被动过。
        $upgrade = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
          '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`""
        )
        if ($upgrade.ExitCode -ne 0) {
          throw "覆盖安装失败，退出码 $($upgrade.ExitCode)"
        }
        if (-not (Test-Path $sentinel)) {
          throw "覆盖安装后用户数据根里的哨兵文件不见了（升级不应搬动数据）：$sentinel"
        }

        $uninstall = Start-Process -FilePath $uninst -Wait -PassThru -ArgumentList @(
          '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
        )
        if ($uninstall.ExitCode -ne 0) {
          throw "静默卸载失败，退出码 $($uninstall.ExitCode)"
        }
        # Inno 的卸载器会把自己复制到临时目录再执行，父进程可能先返回 0；只认退出码
        # 会漏掉"报成功但什么都没删"，所以再等安装目录真的消失。
        $deadline = (Get-Date).AddSeconds(60)
        while ((Test-Path $exe) -and ((Get-Date) -lt $deadline)) {
          Start-Sleep -Milliseconds 500
        }
        if (Test-Path $exe) {
          throw "静默卸载返回 0，但安装目录里仍有 Cubby.exe：$dir"
        }
        if (-not (Test-Path $sentinel)) {
          throw "静默卸载没有保留用户数据：$sentinel"
        }
        Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue
        Write-Host '安装 / 覆盖安装 / 卸载冒烟通过（用户数据全程保留）'

    - name: 上传安装器
      if: inputs.artifact-name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        # 从工作区根目录取：上一步已把安装器与 .sha256 复制到那里，避开
        # upload-artifact 对隐藏路径（.build-dist）的默认过滤。一次运行只会产出一个版本。
        path: |
          Cubby-Setup-*.exe
          Cubby-Setup-*.exe.sha256
        if-no-files-found: error
        retention-days: 7
