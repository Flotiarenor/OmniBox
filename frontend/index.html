<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地图片浏览器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 左侧文件夹树 -->
    <div class="sidebar">
        <h3>资源管理器</h3>
        <div id="folder-tree" class="tree-container"></div>
        <div id="folder-stats" class="folder-stats">共 0 张图片</div>
    </div>

    <!-- 右侧内容区 -->
    <div class="main-content">
        <div class="toolbar">
            <div class="tool-group">
                <button id="btn-multi-select" class="tool-btn">开启多选</button>
                <button id="btn-delete-selected" class="tool-btn danger hidden">删除选中</button>
                <button id="btn-move-selected" class="tool-btn hidden">移动选中</button>
            </div>
            <div class="tool-group" style="margin-left: auto;">
                <button id="btn-settings" class="tool-btn">⚙ 设置</button>
            </div>
        </div>

        <div class="image-grid-container">
            <div id="image-grid" class="grid justified-grid"></div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <!-- 移动文件模态框 -->
    <div id="move-modal" class="modal">
        <div class="modal-content">
            <h3>移动到文件夹</h3>
            <div id="move-tree" class="tree-container move-tree"></div>
            <div class="modal-footer">
                <button class="tool-btn" onclick="viewer.closeMoveModal()">取消</button>
                <button class="tool-btn primary" onclick="viewer.confirmMove()">确认移动</button>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="modal">
        <div class="modal-content" style="width: 380px;">
            <h3>显示与排序设置</h3>
            <div style="padding: 20px;">
                <div class="setting-item">
                    <label>图片行高</label>
                    <input type="range" id="setting-row-height" min="100" max="400" value="200">
                    <span id="setting-row-height-val">200</span>
                </div>
                <div class="setting-item" style="margin-top: 20px;">
                    <label>每页图片数</label>
                    <input type="number" id="setting-per-page" min="10" max="200" step="10" value="40">
                </div>
                <div class="setting-item" style="margin-top: 20px;">
                    <label>排序方式</label>
                    <select id="setting-sort-by" style="padding: 4px; border-radius: 4px;">
                        <option value="mtime">修改时间</option>
                        <option value="name">文件名</option>
                    </select>
                </div>
                <div class="setting-item" style="margin-top: 20px;">
                    <label>排序方向</label>
                    <select id="setting-sort-order" style="padding: 4px; border-radius: 4px;">
                        <option value="desc">倒序 (新-旧 / Z-A)</option>
                        <option value="asc">正序 (旧-新 / A-Z)</option>
                    </select>
                </div>
                <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee;">
                    <label style="display: flex; align-items: center; font-size: 13px; color: #555; cursor: pointer;">
                        <input type="checkbox" id="setting-apply-to-folder" style="margin-right: 8px;">
                        仅应用于当前文件夹 (<span id="setting-current-folder-name">根目录</span>)
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="tool-btn" onclick="viewer.closeSettingsModal()">取消</button>
                <button class="tool-btn primary" onclick="viewer.saveSettings()">保存并刷新</button>
            </div>
        </div>
    </div>

    <!-- JS加载顺序很重要 -->
    <script src="js/utils.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/components/tree.js"></script>
    <script src="js/components/lightbox.js"></script>
    <script src="js/components/pagination.js"></script>
    <script src="js/components/context-menu.js"></script>
    <script src="js/views/image-viewer.js"></script>

    <script>
        let viewer = null;

        async function initApp() {
            try {
                await bridge.init();
                viewer = new ImageViewer();
                await viewer.init();
            } catch (error) {
                console.error('应用初始化失败:', error);
                const grid = document.getElementById('image-grid');
                if (grid) {
                    grid.innerHTML = '<div style="text-align:center;padding:40px;color:#d9534f;">前端与后端连接失败，请重启应用</div>';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
