<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230078d4'/><text x='16' y='22' font-size='18' fill='white' text-anchor='middle' font-family='Arial'>O</text></svg>">
    <title>OmniBox</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/views/image-viewer.css">
    <link rel="stylesheet" href="css/views/manga-library.css">
    <link rel="stylesheet" href="css/views/novel-reader.css">
    <link rel="stylesheet" href="css/views/download-center.css">
</head>
<body>
    <div class="app-container">

        <!-- 左侧导航栏 -->
        <aside class="nav-sidebar no-select" id="nav-sidebar">
            <div class="nav-sidebar-header">
                <span class="nav-logo">🏠</span>
                <span class="nav-title">OmniBox</span>
            </div>
            <nav class="nav-menu" id="nav-menu">
                <div class="nav-item active" data-view="image-viewer">
                    <span class="nav-icon">🖼️</span>
                    <span class="nav-text">图片浏览</span>
                </div>
                <div class="nav-item" data-view="manga-library">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">漫画库</span>
                </div>
                <div class="nav-item" data-view="novel-reader">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">小说阅读</span>
                </div>
                <div class="nav-item" data-view="download-center">
                    <span class="nav-icon">⬇️</span>
                    <span class="nav-text">下载中心</span>
                </div>
                <div class="nav-item" data-view="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">设置</span>
                </div>
            </nav>
        </aside>

        <!-- 主区域：每个视图自己决定内部布局 -->
        <main class="main-area" id="main-area">

            <!-- ===== 图片浏览视图 ===== -->
            <div class="view no-select" id="view-image-viewer">
                <div class="view-sub-sidebar">
                    <div class="sub-sidebar-header">资源管理器</div>
                    <div id="folder-tree" class="tree-container"></div>
                    <div id="folder-stats" class="sub-sidebar-footer">共 0 张图片</div>
                </div>
                <div class="view-body">
                    <div class="view-toolbar">
                        <div class="toolbar-group">
                            <button id="btn-multi-select" class="btn">开启多选</button>
                            <button id="btn-delete-selected" class="btn btn-danger hidden">删除选中</button>
                            <button id="btn-move-selected" class="btn hidden">移动选中</button>
                        </div>
                        <div class="toolbar-group" style="margin-left:auto;">
                            <button id="btn-settings" class="btn">⚙ 设置</button>
                        </div>
                    </div>
                    <div class="view-content" id="image-grid-container">
                        <div id="image-grid" class="grid"></div>
                    </div>
                    <div id="pagination" class="pagination-bar"></div>
                </div>
            </div>

            <!-- ===== 漫画库视图 ===== -->
            <div class="view no-select" id="view-manga-library">
                <div class="view-body">
                    <div class="view-toolbar">
                        <div class="toolbar-group">
                            <input type="text" id="manga-search" class="search-input" placeholder="搜索漫画、作者...">
                        </div>
                    </div>
                    
                    <!-- 首页 -->
                    <div class="view-content manga-home" id="manga-home">
                        <section class="home-section">
                            <h3 class="section-title">🕐 最近阅读</h3>
                            <div id="recent-grid" class="card-grid"></div>
                        </section>
                        <section class="home-section">
                            <h3 class="section-title">⭐ 我的收藏</h3>
                            <div id="favorites-grid" class="card-grid"></div>
                        </section>
                        <section class="home-section">
                            <h3 class="section-title">📚 全部漫画</h3>
                            <div id="manga-grid" class="card-grid"></div>
                        </section>
                    </div>

                    <!-- 详情页 (默认隐藏) -->
                    <div class="view-content" id="manga-detail-view" style="display: none;">
                        <div class="detail-header">
                            <button id="detail-back" class="btn">← 返回</button>
                            <div class="detail-title-row">
                                <h2 id="detail-title"></h2>
                                <button id="detail-fav-btn" class="btn btn-fav">☆ 收藏</button>
                            </div>
                            <p id="detail-author" style="color: var(--text-secondary); margin-top:5px;"></p>
                        </div>
                        
                        <!-- 详细信息区 -->
                        <div id="detail-info-box" class="detail-info-box"></div>

                        <!-- 章节或图片列表容器 -->
                        <div id="detail-content-grid" class="card-grid"></div>
                    </div>
                </div>
            </div>

            <!-- 沉浸式漫画阅读器 (全局覆盖层) -->
            <div id="manga-reader-container no-select" class="manga-reader">
                <div class="reader-toolbar">
                    <button class="reader-close btn-icon">✕</button>
                    <span class="reader-info">1 / 1</span>
                </div>
                <button class="reader-arrow reader-prev">‹</button>
                <div class="reader-image-wrapper">
                    <img src="" alt="manga page">
                </div>
                <button class="reader-arrow reader-next">›</button>
            </div>

            <div class="view" id="view-novel-reader">
            <div class="view-body">
                <!-- 工具栏 -->
                <div class="view-toolbar">
                    <div class="toolbar-group">
                        <input type="text" id="novel-search" class="search-input" 
                            placeholder="搜索小说标题或作者...">
                    </div>
                </div>
                
                <!-- 小说列表视图 -->
                <div class="view-content" id="novel-list-view">
                    <div id="novel-grid" class="novel-grid"></div>
                </div>
                
                <!-- 阅读器视图（默认隐藏） -->
                <div class="novel-reader-container" id="novel-reader-view" style="display:none;">
                    <!-- 工具栏 -->
                    <div class="novel-reader-toolbar">
                        <button id="novel-back" class="btn-icon" title="返回 (Esc)">←</button>
                        <div class="novel-reader-title" id="novel-chapter-title">章节标题</div>
                        <button id="novel-chapter-btn" class="btn-icon" title="章节列表">☰</button>
                        <button id="novel-prev" class="btn-icon" title="上一章 (←)">‹</button>
                        <button id="novel-next" class="btn-icon" title="下一章 (→)">›</button>
                    </div>
                    
                    <!-- 设置栏 -->
                    <div class="novel-reader-settings">
                        <label>
                            字号:
                            <input type="range" id="novel-font-size" min="12" max="32" value="16" step="1">
                            <span class="setting-value" id="novel-font-size-value">16</span>
                        </label>
                        <label>
                            行距:
                            <input type="range" id="novel-line-height" min="1.2" max="2.5" value="1.8" step="0.1">
                            <span class="setting-value" id="novel-line-height-value">1.8</span>
                        </label>
                        <label>
                            字间距:
                            <input type="range" id="novel-letter-spacing" min="0" max="5" value="0" step="0.5">
                            <span class="setting-value" id="novel-letter-spacing-value">0px</span>
                        </label>
                        <label>
                            主题:
                            <select id="novel-theme-select">
                                <option value="light">明亮</option>
                                <option value="dark">暗黑</option>
                                <option value="sepia">护眼</option>
                                <option value="green">绿色</option>
                                <option value="blue">蓝色</option>
                                <option value="custom">自定义</option>
                            </select>
                        </label>
                        <label id="custom-color-label" style="display:none;">
                            背景:
                            <input type="color" id="novel-bg-color" value="#ffffff">
                        </label>
                        <label id="custom-text-label" style="display:none;">
                            文字:
                            <input type="color" id="novel-text-color" value="#1a1a1a">
                        </label>
                        <label>
                            编码:
                            <select id="novel-encoding">
                                <option value="auto">自动检测</option>
                                <option value="utf-8">UTF-8</option>
                                <option value="gbk">GBK</option>
                                <option value="gb2312">GB2312</option>
                            </select>
                        </label>
                    </div>
                    
                    <!-- 内容区 -->
                    <div class="novel-content-area" id="novel-content-area"></div>
                    
                    <!-- 进度条 -->
                    <div class="novel-progress-bar">
                        <div class="novel-progress-fill" id="novel-progress-fill" style="width:0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 章节选择器（全局覆盖层） -->
        <div class="novel-chapter-selector" id="novel-chapter-selector">
            <div class="novel-chapter-list" id="novel-chapter-list"></div>
        </div>

        <!-- 章节选择器（全局覆盖层） -->
        <div class="novel-chapter-selector" id="novel-chapter-selector">
            <div class="novel-chapter-list" id="novel-chapter-list"></div>
        </div>
            <!-- 下载中心视图 -->
            <div class="view no-select" id="view-download-center">
                <div class="view-body">
                    <!-- 工具栏 -->
                    <div class="view-toolbar">
                        <div class="toolbar-group">
                            <button id="dc-add-task" class="btn btn-primary">+ 添加任务</button>
                            <button id="dc-start-all" class="btn">▶ 全部开始</button>
                            <button id="dc-pause-all" class="btn">⏸ 全部暂停</button>
                            <button id="dc-clear-completed" class="btn">🗑 清除已完成</button>
                        </div>
                        <div class="toolbar-group" style="margin-left:auto;">
                            <div class="dc-filter-group">
                                <button class="btn dc-filter-btn active" data-filter="all">全部</button>
                                <button class="btn dc-filter-btn" data-filter="downloading">下载中</button>
                                <button class="btn dc-filter-btn" data-filter="paused">已暂停</button>
                                <button class="btn dc-filter-btn" data-filter="completed">已完成</button>
                                <button class="btn dc-filter-btn" data-filter="failed">失败</button>
                            </div>
                        </div>
                    </div>

                    <!-- 统计概览 -->
                    <div class="dc-stats-bar">
                        <div class="dc-stat-item">
                            <span class="dc-stat-value" id="dc-stat-total">0</span>
                            <span class="dc-stat-label">总任务</span>
                        </div>
                        <div class="dc-stat-item">
                            <span class="dc-stat-value dc-stat-active" id="dc-stat-active">0</span>
                            <span class="dc-stat-label">活跃中</span>
                        </div>
                        <div class="dc-stat-item">
                            <span class="dc-stat-value dc-stat-completed" id="dc-stat-completed">0</span>
                            <span class="dc-stat-label">已完成</span>
                        </div>
                        <div class="dc-stat-item">
                            <span class="dc-stat-value dc-stat-speed" id="dc-stat-speed">0 B/s</span>
                            <span class="dc-stat-label">下载速度</span>
                        </div>
                        <div class="dc-stat-item">
                            <span class="dc-stat-value" id="dc-stat-queue">0</span>
                            <span class="dc-stat-label">排队中</span>
                        </div>
                    </div>

                    <!-- 任务列表 -->
                    <div class="view-content dc-task-list" id="dc-task-list">
                        <!-- 空状态 -->
                        <div class="dc-empty-state" id="dc-empty-state">
                            <div class="dc-empty-icon">⬇️</div>
                            <div class="dc-empty-text">暂无下载任务</div>
                            <div class="dc-empty-hint">点击「添加任务」开始下载漫画</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 添加任务模态框 -->
            <div id="dc-add-modal" class="modal">
                <div class="modal-box" style="width:480px;">
                    <h3>添加下载任务</h3>
                    <div style="padding:20px;">
                        <div style="margin-bottom:16px;">
                            <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;">漫画 ID 或 URL</label>
                            <input type="text" id="dc-input-id" class="search-input" 
                                placeholder="例如: 123456 或 https://18comic.vip/album/123456"
                                style="width:100%;max-width:none;">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;">下载目录</label>
                            <div style="display:flex;gap:8px;">
                                <input type="text" id="dc-input-dir" class="search-input" 
                                    value="./本子" style="flex:1;">
                                <button id="dc-browse-dir" class="btn">浏览</button>
                            </div>
                        </div>
                        <div style="display:flex;gap:16px;margin-bottom:16px;">
                            <div style="flex:1;">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;">并发数</label>
                                <input type="number" id="dc-input-concurrency" class="search-input" 
                                    value="3" min="1" max="10" style="width:80px;">
                            </div>
                            <div style="flex:1;">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;">优先级</label>
                                <select id="dc-input-priority" class="search-input" style="width:120px;">
                                    <option value="high">高</option>
                                    <option value="normal" selected>普通</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                                <input type="checkbox" id="dc-input-auto-start" checked>
                                添加后自动开始下载
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="dc-cancel-add" class="btn">取消</button>
                        <button id="dc-confirm-add" class="btn btn-primary">添加任务</button>
                    </div>
                </div>
            </div>

            <!-- 任务详情模态框 -->
            <div id="dc-detail-modal" class="modal">
                <div class="modal-box" style="width:560px;">
                    <h3>任务详情</h3>
                    <div id="dc-detail-content" style="padding:20px;overflow-y:auto;max-height:60vh;"></div>
                    <div class="modal-footer">
                        <button id="dc-close-detail" class="btn">关闭</button>
                    </div>
                </div>
            </div>
            <div class="view no-select" id="view-settings">
                <div class="view-body">
                    <div class="view-content">
                        <div class="empty-state">⚙️ 设置 — 开发中</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 移动文件模态框 -->
    <div id="move-modal" class="modal">
        <div class="modal-box">
            <h3>移动到文件夹</h3>
            <div id="move-tree" class="tree-container move-tree"></div>
            <div class="modal-footer">
                <button class="btn" onclick="imageViewer.closeMoveModal()">取消</button>
                <button class="btn btn-primary" onclick="imageViewer.confirmMove()">确认移动</button>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="modal">
        <div class="modal-box" style="width:380px;">
            <h3>显示与排序设置</h3>
            <div style="padding:20px;">
                <div class="setting-item">
                    <label>图片行高</label>
                    <input type="range" id="setting-row-height" min="100" max="400" value="200">
                    <span id="setting-row-height-val">200</span>
                </div>
                <div class="setting-item" style="margin-top:20px;">
                    <label>每页图片数</label>
                    <input type="number" id="setting-per-page" min="10" max="200" step="10" value="40">
                </div>
                <div class="setting-item" style="margin-top:20px;">
                    <label>排序方式</label>
                    <select id="setting-sort-by">
                        <option value="mtime">修改时间</option>
                        <option value="name">文件名</option>
                    </select>
                </div>
                <div class="setting-item" style="margin-top:20px;">
                    <label>排序方向</label>
                    <select id="setting-sort-order">
                        <option value="desc">倒序</option>
                        <option value="asc">正序</option>
                    </select>
                </div>
                <div style="margin-top:25px;padding-top:15px;border-top:1px solid var(--border);">
                    <label style="display:flex;align-items:center;font-size:13px;color:var(--text-secondary);cursor:pointer;">
                        <input type="checkbox" id="setting-apply-to-folder" style="margin-right:8px;">
                        仅应用于当前文件夹 (<span id="setting-current-folder-name">根目录</span>)
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="imageViewer.closeSettingsModal()">取消</button>
                <button class="btn btn-primary" onclick="imageViewer.saveSettings()">保存并刷新</button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="js/utils.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/components/tree.js"></script>
    <script src="js/components/lightbox.js"></script>
    <script src="js/components/pagination.js"></script>
    <script src="js/components/context-menu.js"></script>
    <script src="js/components/card-grid.js"></script>
    <script src="js/view-manager.js"></script>
    <script src="js/views/image-viewer.js"></script>
    <script src="js/views/manga-reader.js"></script>
    <script src="js/views/manga-library.js"></script>
    <script src="js/views/novel-reader.js"></script>
    <script src="js/views/download-center.js"></script>

    <script>
        // 确保这些变量在全局作用域
        let imageViewer, mangaLibrary, downloadCenter, novelReader;

        async function initApp() {
        try {
            await bridge.init();
            const viewManager = new ViewManager();

            // 初始化各视图
            imageViewer = new ImageViewer();
            mangaLibrary = new MangaLibrary();
            downloadCenter = new DownloadCenter();
            novelReader = new NovelReader();

            // 注册视图
            viewManager.register('image-viewer', async () => {
                await imageViewer.init();
            });
            viewManager.register('manga-library', async () => {
                await mangaLibrary.init();
            });
            viewManager.register('download-center', async () => {
                await downloadCenter.init();
            });
            viewManager.register('novel-reader', async () => {
                await novelReader.init();
            });
            viewManager.register('settings', () => {});

            viewManager.switchTo('image-viewer');
        } catch (error) {
            console.error('应用初始化失败:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
