<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫画中心</title>
  <link rel="stylesheet" href="manga-library.css">
  <!--
    本页是壳 iframe 里的内容页：品牌块、左栏导航、顶栏标题、工具栏动作、搜索框、
    状态栏与分隔条由壳按 manifest 的 frontend.chrome 渲染；这里只保留内容
    （书架、下载中心、漫画详情、两个弹窗与阅读器）。

    视图切换与工具栏动作经 postMessage 进来（omnibox:view / omnibox:action /
    omnibox:query），标题、副标题、动作显隐与禁用、导航徽标、搜索可用性与状态
    反向上报（omnibox:chrome）。复合导航 id `downloads:<filter>` 表示下载中心的
    过滤项。

    阅读器是内容区内的沉浸层：`position: fixed` 只覆盖本站文档（即内容 iframe
    的视口），壳 chrome 在父文档里，不会被遮挡。
  -->
</head>
<body>
  <div id="app">
    <div class="view-body">
      <div class="view-content ml-content obx-scroll" id="ml-content"></div>
    </div>

    <!-- ===== 沉浸式阅读器（内容区全屏覆盖） ===== -->
    <div class="manga-reader no-select" id="manga-reader-container">
      <div class="reader-toolbar">
        <button class="reader-close btn-icon"><svg class="obx-icon"><use href="#x"></use></svg></button>
        <span class="reader-info">1 / 1</span>
      </div>
      <button class="reader-arrow reader-prev">‹</button>
      <div class="reader-image-wrapper">
        <img src="" alt="manga page">
      </div>
      <button class="reader-arrow reader-next">›</button>
    </div>

    <!-- ===== 添加任务 ===== -->
    <div id="ml-add-modal" class="modal">
      <div class="modal-box obx-anim-scale" style="width:480px;">
        <h3>添加下载任务</h3>
        <div class="modal-body">
          <div class="ml-field">
            <label>漫画 ID 或 URL</label>
            <input type="text" id="ml-input-id" class="search-input" placeholder="例如: 123456 或 https://18comic.vip/album/123456" style="width:100%;max-width:none;">
          </div>
          <div class="ml-field-row">
            <div class="ml-field">
              <label>并发数</label>
              <input type="number" id="ml-input-concurrency" class="search-input" value="3" min="1" max="10" style="width:80px;">
            </div>
            <div class="ml-field">
              <label>优先级</label>
              <select id="ml-input-priority" class="search-input" style="width:120px;">
                <option value="high">高</option>
                <option value="normal" selected>普通</option>
                <option value="low">低</option>
              </select>
            </div>
          </div>
          <label class="ml-check">
            <input type="checkbox" id="ml-input-auto-start" checked> 添加后自动开始下载
          </label>
        </div>
        <div class="modal-footer">
          <button id="ml-cancel-add" class="btn">取消</button>
          <button id="ml-confirm-add" class="btn btn-primary">添加任务</button>
        </div>
      </div>
    </div>

    <!-- ===== 任务详情 ===== -->
    <div id="ml-detail-modal" class="modal">
      <div class="modal-box obx-anim-scale" style="width:560px;">
        <h3>任务详情</h3>
        <div class="modal-body" id="ml-detail-content"></div>
        <div class="modal-footer">
          <button id="ml-close-detail" class="btn">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.mangaLibraryApp = new MangaLibraryApp();
    mangaLibraryApp.init();
  </script>
</body>
</html>
