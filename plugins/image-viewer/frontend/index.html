<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片相册</title>
  <link rel="stylesheet" href="image-viewer.css">
  <!--
    本页是壳 iframe 里的内容页：品牌块/左栏/导航/扩展入口/顶栏/搜索/状态栏/分隔条由壳按
    manifest 的 frontend.chrome 渲染；这里只保留内容（相册卡片、justified 图片网格、分页、
    灯箱、相册右键菜单、三个弹窗与缩略图重建进度卡）。

    视图切换、工具栏动作与搜索经 postMessage 进来（omnibox:view / omnibox:action /
    omnibox:query），标题/副标题/视图/动作显隐/搜索占位/状态反向上报（omnibox:chrome）。
    附属插件（image-cleaner / pixiv-sync）的 native 面板由壳打开，宿主不再渲染侧栏入口；
    #extension-view 仅给不认 native 的旧壳，当前壳不进入这里。
  -->
</head>
<body>
  <div id="app">
    <div class="view-body">
      <div class="view-content iv-content obx-scroll" id="iv-content">
        <div id="iv-albums"></div>
        <div id="image-grid" class="iv-image-grid"></div>
      </div>
      <div id="pagination" class="pagination-bar"></div>

      <div id="extension-view" class="extension-view hidden">
        <div class="extension-view-header">
          <!-- 旧 embed 回落：仅给不认 native 的旧壳，当前壳不进入这里。内嵌插件
               （image-cleaner / pixiv-sync）把「设置」这类操作挂到
               #extension-view-actions（HostChannel.mountToolbar）。头部只有「标题行 + 挂载点」
               两个子项，不再自带按钮；native 面板由壳渲染后这条路径不再被新壳调用。 -->
          <div class="extension-view-heading">
            <div class="iv-view-title" id="extension-view-title">扩展</div>
            <div class="iv-view-sub" id="extension-view-sub"></div>
          </div>
          <div class="extension-view-actions" id="extension-view-actions"></div>
        </div>
        <div class="extension-view-body">
          <iframe id="extension-frame" title="扩展插件"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div id="new-album-modal" class="modal">
    <div class="modal-box obx-anim-scale" style="width:360px;">
      <h3>新建相册</h3>
      <div class="modal-body">
        <div class="iv-field">
          <label>相册名称</label>
          <input type="text" id="iv-new-album-name" class="search-input" placeholder="例如：2026 旅行照片" style="width:100%;max-width:none;">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="iv-new-album-cancel">取消</button>
        <button class="btn btn-primary" id="iv-new-album-confirm">创建</button>
      </div>
    </div>
  </div>

  <div id="move-modal" class="modal">
    <div class="modal-box obx-anim-scale">
      <h3>移动到文件夹</h3>
      <div id="move-tree" class="tree-container move-tree" style="min-height:200px;"></div>
      <div class="modal-footer">
        <button class="btn" id="move-cancel">取消</button>
        <button class="btn btn-primary" id="move-confirm">确认移动</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal">
    <div class="modal-box obx-anim-scale" style="width:400px;">
      <h3>显示与排序设置</h3>
      <div class="iv-settings-body obx-scroll">
        <div class="iv-setting-section iv-setting-section-first">外观</div>
        <label class="iv-check">
          <input type="checkbox" id="setting-follow-shell" checked> 跟随壳透明度（<span id="setting-shell-alpha">84</span>%）
        </label>
        <div class="iv-setting-item">
          <label>背景不透明度 <span id="setting-plugin-alpha-val">84</span>%</label>
          <input type="range" id="setting-plugin-alpha" min="30" max="100" value="84" class="iv-range">
        </div>

        <div class="iv-setting-section">图片文件夹</div>
        <!-- 列表由共享组件 shell/folder-picker.js 填充（插件不再自带实现） -->
        <div id="setting-roots"></div>
        <p class="iv-setting-note iv-setting-note-after-input">第一行为主目录（沿用相对路径），其余目录会作为顶层「文件夹」出现。保存后生效。</p>

        <div class="iv-setting-section">显示与排序</div>
        <div class="iv-setting-item">
          <label>图片行高 <span id="setting-row-height-val">200</span></label>
          <input type="range" id="setting-row-height" min="100" max="400" value="200" class="iv-range">
        </div>
        <div class="iv-setting-item">
          <label>每页图片数</label>
          <input type="number" id="setting-per-page" min="10" max="200" step="10" value="40">
        </div>
        <div class="iv-setting-item">
          <label>图片缓存 <span id="setting-lightbox-cache-val">8</span> 张</label>
          <input type="range" id="setting-lightbox-cache" min="0" max="64" value="8" class="iv-range">
        </div>
        <p class="iv-setting-note iv-setting-note-after-input">
          缓存最近看过的图，再打开时直接显示，不用等它一行行刷出来。数值越大越流畅，占内存也越多；0 = 关闭。
        </p>
        <div class="iv-setting-item">
          <label>排序方式</label>
          <select id="setting-sort-by">
            <option value="mtime">修改时间</option>
            <option value="name">文件名</option>
            <option value="time_name">Pixiv 排序支持</option>
          </select>
        </div>
        <div class="iv-setting-item">
          <label>排序方向</label>
          <select id="setting-sort-order">
            <option value="desc">倒序</option>
            <option value="asc">正序</option>
          </select>
        </div>
        <div id="setting-pixiv-fuzzy-section" class="hidden">
          <div class="iv-setting-section">Pixiv 排序（模糊匹配）</div>
          <label class="iv-check">
            <input type="checkbox" id="setting-pixiv-fuzzy"> 模糊匹配
          </label>
          <p class="iv-setting-note">仅「Pixiv 排序支持」时可勾选：作品名不是数字开头时按「先数字再文字」排序，并让该文件夹套用 Pixiv 的浏览效果</p>
        </div>
        <div id="setting-album-sort-section">
          <div class="iv-setting-section">作者视图（Pixiv 排序）二次排序</div>
          <div class="iv-setting-item">
            <label>排序方式</label>
            <select id="setting-album-sort-by">
              <option value="mtime">更新时间</option>
              <option value="name">文件名</option>
              <option value="count">图片数量</option>
            </select>
          </div>
          <div class="iv-setting-item">
            <label>排序方向</label>
            <select id="setting-album-sort-order">
              <option value="desc">倒序</option>
              <option value="asc">正序</option>
            </select>
          </div>
          <p class="iv-setting-note">当前文件夹生效 Pixiv 排序时才会出现：画师网格的二次排序，全局生效</p>
        </div>
        <label class="iv-check">
          <input type="checkbox" id="setting-apply-to-folder"> 仅应用于当前文件夹（<span id="setting-current-folder-name">根目录</span>）
        </label>
      </div>
      <div id="settings-errors" class="iv-settings-errors hidden" role="alert"></div>
      <div class="modal-footer">
        <button class="btn" id="settings-cancel">取消</button>
        <button class="btn btn-primary" id="settings-save">保存并刷新</button>
      </div>
    </div>
  </div>

  <div id="rebuild-progress" class="rebuild-progress-card hidden">
    <div class="rebuild-progress-header">
      <span><svg class="obx-icon"><use href="#brush-cleaning"></use></svg> 正在重建缩略图</span>
      <button id="rebuild-progress-hide" class="rebuild-progress-hide" title="隐藏进度">—</button>
    </div>
    <div class="rebuild-progress-body">
      <div id="rebuild-progress-text" class="rebuild-progress-text">0 / 0</div>
      <div class="rebuild-progress"><div id="rebuild-progress-bar" class="rebuild-progress-bar"></div></div>
      <div id="rebuild-progress-current" class="rebuild-progress-current"></div>
      <div id="rebuild-progress-speed" class="rebuild-progress-speed"></div>
      <div id="rebuild-errors" class="rebuild-errors"></div>
      <button id="rebuild-progress-cancel" class="btn btn-sm">取消</button>
    </div>
  </div>

  <script src="js/justified-layout.js"></script>
  <script src="js/app.js"></script>
  <!-- ImageViewer.prototype 的分片：顺序是硬约束，必须排在 app.js 之后、实例化之前。
       漏挂或错序会在装载期抛 `ImageViewer is not defined`；契约由
       tests/js/image_viewer_app_split.mjs 把关。 -->
  <script src="js/app-albums.js"></script>
  <script src="js/app-nav.js"></script>
  <script src="js/app-grid.js"></script>
  <script src="js/app-refresh.js"></script>
  <script src="js/app-settings.js"></script>
  <script src="js/app-utils.js"></script>
  <script>
    window.imageViewer = new ImageViewer();
    imageViewer.init();
  </script>
</body>
</html>
