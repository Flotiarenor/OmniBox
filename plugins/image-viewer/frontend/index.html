<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片相册</title>
  <link rel="stylesheet" href="image-viewer.css">
</head>
<body>
  <div id="app">
    <aside class="iv-sidebar view-sub-sidebar obx-glass">
      <div class="iv-brand">
        <div class="iv-brand-icon">🖼️</div>
        <div class="iv-brand-text">
          <div class="iv-brand-title">图片相册</div>
          <div class="iv-brand-sub">Gallery</div>
        </div>
      </div>
      <nav class="iv-nav">
        <div class="iv-nav-label">浏览</div>
        <button class="iv-nav-item active" data-view="albums"><span>🗂️</span>全部相册</button>
        <button class="iv-nav-item" data-view="timeline"><span>🕐</span>时间线</button>
        <button class="iv-nav-item" data-view="latest"><span>✨</span>最近添加</button>
        <div id="iv-extensions"></div>
      </nav>
      <div class="iv-nav-footer">
        <button id="iv-new-album" class="iv-nav-item"><span>＋</span>新建相册</button>
      </div>
      <div class="iv-sidebar-footer" id="iv-stats">正在读取…</div>
    </aside>

    <div class="view-body">
      <div class="view-toolbar iv-toolbar">
        <div class="toolbar-group iv-view-heading">
          <button id="iv-back" class="btn btn-sm hidden">← 返回</button>
          <div>
            <div class="iv-view-title" id="iv-view-title">全部相册</div>
            <div class="iv-view-sub" id="iv-view-sub"></div>
          </div>
        </div>
        <div class="toolbar-group" style="margin-left:auto;">
          <div class="iv-search" id="iv-search-wrap">
            <span class="iv-search-ico">🔍</span>
            <input type="text" id="iv-search" placeholder="搜索相册…" autocomplete="off">
            <button id="iv-search-clear" class="iv-search-clear hidden">✕</button>
          </div>
          <span id="iv-selection-count" class="iv-selection-count hidden">已选 0 项</span>
          <button id="btn-slideshow" class="btn hidden">▶ 幻灯片</button>
          <button id="btn-multi-select" class="btn hidden">开启多选</button>
          <button id="btn-delete-selected" class="btn btn-danger hidden">删除选中</button>
          <button id="btn-move-selected" class="btn hidden">移动选中</button>
          <button id="btn-refresh-thumbs" class="btn hidden">🖼 更新缩略图</button>
          <button id="btn-refresh" class="btn" title="重新扫描目录并刷新当前视图（无需重启）">🔄 刷新</button>
          <button id="btn-rebuild" class="btn" title="清空缩略图/尺寸元数据/相册索引并重新扫描，缩略图按需重建">🧹 全量重建</button>
          <button id="btn-settings" class="btn">⚙ 设置</button>
        </div>
      </div>

      <div class="view-content iv-content obx-scroll" id="iv-content">
        <div id="iv-album-sort" class="iv-album-sort hidden">
          <span class="iv-sort-label">排序</span>
          <select id="iv-album-sort-by" class="iv-sort-select">
            <option value="name">文件名</option>
            <option value="mtime">更新时间</option>
            <option value="count">图片数量</option>
          </select>
          <button id="iv-album-sort-order" class="btn btn-sm">↓ 倒序</button>
        </div>
        <div id="iv-albums"></div>
        <div id="image-grid" class="iv-image-grid"></div>
      </div>
      <div id="pagination" class="pagination-bar"></div>

      <div id="extension-view" class="extension-view hidden">
        <div class="extension-view-header">
          <span id="extension-view-title">扩展</span>
          <button class="btn btn-sm" id="extension-view-close">返回相册</button>
        </div>
        <div class="extension-view-body">
          <iframe id="extension-frame" title="扩展插件"></iframe>
        </div>
      </div>
    </div>

    <div id="new-album-modal" class="modal">
      <div class="modal-box obx-anim-scale" style="width:360px;">
        <h3>新建相册</h3>
        <div class="modal-body">
          <div class="iv-field">
            <label>相册名称</label>
            <input type="text" id="iv-new-album-name" class="search-input" placeholder="例如：2026 旅行照片" style="width:100%;max-width:none;">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" id="iv-new-album-cancel">取消</button>
          <button class="btn btn-primary" id="iv-new-album-confirm">创建</button>
        </div>
      </div>
    </div>

    <div id="move-modal" class="modal">
      <div class="modal-box obx-anim-scale">
        <h3>移动到文件夹</h3>
        <div id="move-tree" class="tree-container move-tree" style="min-height:200px;"></div>
        <div class="modal-footer">
          <button class="btn" id="move-cancel">取消</button>
          <button class="btn btn-primary" id="move-confirm">确认移动</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal">
      <div class="modal-box obx-anim-scale" style="width:400px;">
        <h3>显示与排序设置</h3>
        <div style="padding:20px;">
          <div class="iv-setting-item">
            <label>数据根目录</label>
            <input type="text" id="setting-root-dir" class="search-input" placeholder="默认: ./data">
          </div>
          <div class="iv-setting-item">
            <label>图片行高 <span id="setting-row-height-val">200</span></label>
            <input type="range" id="setting-row-height" min="100" max="400" value="200" class="iv-range">
          </div>
          <div class="iv-setting-item">
            <label>每页图片数</label>
            <input type="number" id="setting-per-page" min="10" max="200" step="10" value="40">
          </div>
          <div class="iv-setting-item">
            <label>排序方式</label>
            <select id="setting-sort-by">
              <option value="mtime">修改时间</option>
              <option value="name">文件名</option>
              <option value="time_name">Pixiv 排序支持</option>
            </select>
          </div>
          <div class="iv-setting-item">
            <label>排序方向</label>
            <select id="setting-sort-order">
              <option value="desc">倒序</option>
              <option value="asc">正序</option>
            </select>
          </div>
          <label class="iv-check">
            <input type="checkbox" id="setting-apply-to-folder"> 仅应用于当前文件夹（<span id="setting-current-folder-name">根目录</span>）
          </label>
        </div>
        <div class="modal-footer">
          <button class="btn" id="settings-cancel">取消</button>
          <button class="btn btn-primary" id="settings-save">保存并刷新</button>
        </div>
      </div>

      <div id="rebuild-modal" class="modal">
        <div class="modal-box obx-anim-scale rebuild-box">
          <div class="rebuild-spinner"></div>
          <h3>正在全量重建</h3>
          <p class="rebuild-tip">正在清空并重建缓存，请稍候…</p>
          <div class="rebuild-progress"><div class="rebuild-progress-bar"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/justified-layout.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.imageViewer = new ImageViewer();
    imageViewer.init();
  </script>
</body>
</html>
