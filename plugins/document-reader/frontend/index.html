<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档阅读</title>
  <link rel="stylesheet" href="document-reader.css">
</head>
<body>
  <div id="app">
    <!-- 左侧边栏：书架 / 章节目录 -->
    <div class="view-sub-sidebar nr-sidebar obx-glass">
      <div class="nr-brand">
        <div class="nr-brand-icon">📖</div>
        <div>
          <div class="nr-brand-title">文档阅读</div>
          <div class="nr-brand-sub">Reader</div>
        </div>
      </div>
      <div class="sidebar-toggle">
        <button id="sidebar-toggle-shelf" class="btn btn-sm active">📚 书架</button>
        <button id="sidebar-toggle-chapters" class="btn btn-sm">📖 章节</button>
      </div>

      <!-- 书架面板 -->
      <div id="document-shelf-panel" class="sidebar-panel obx-scroll">
        <div id="document-shelf-list" class="document-shelf-list"></div>
      </div>

      <!-- 章节目录面板 -->
      <div id="document-chapter-panel" class="sidebar-panel obx-scroll" style="display:none;">
        <div id="document-chapter-list" class="document-chapter-list obx-scroll"></div>
      </div>
    </div>

    <!-- 右侧主区域 -->
    <div class="view-body">
      <!-- 单排工具栏：书架模式显示搜索，阅读模式显示导航；设置固定在右上角 -->
      <div class="view-toolbar">
        <div class="toolbar-group" id="document-browse-group">
          <input type="text" id="document-search" class="search-input" placeholder="搜索标题或作者...">
        </div>
        <div class="toolbar-group" id="document-reader-nav" style="display:none;">
          <div class="document-reader-title" id="document-chapter-title">未打开文档</div>
        </div>
        <div class="toolbar-group" style="margin-left:auto;">
          <button id="document-font-toggle" class="btn" title="阅读设置" style="display:none;">A·文</button>
          <button id="btn-settings" class="btn">⚙ 设置</button>
        </div>
      </div>

      <!-- 阅读设置栏（仅阅读时显示，可折叠） -->
      <div class="document-reader-settings" id="document-reader-settings-bar" style="display:none;">
        <label>
          字号:
          <input type="range" id="document-font-size" min="12" max="32" value="16" step="1">
          <span class="setting-value" id="document-font-size-value">16</span>
        </label>
        <label>
          行距:
          <input type="range" id="document-line-height" min="1.2" max="2.5" value="1.8" step="0.1">
          <span class="setting-value" id="document-line-height-value">1.8</span>
        </label>
        <label>
          字间距:
          <input type="range" id="document-letter-spacing" min="0" max="5" value="0" step="0.5">
          <span class="setting-value" id="document-letter-spacing-value">0px</span>
        </label>
        <label>
          主题:
          <select id="document-theme-select">
            <option value="auto">跟随主题</option>
            <option value="sepia">护眼纸</option>
            <option value="dark">夜间</option>
            <option value="green">绿色</option>
            <option value="blue">蓝色</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label id="custom-color-label" style="display:none;">
          背景:
          <input type="color" id="document-bg-color" value="#ffffff">
        </label>
        <label id="custom-text-label" style="display:none;">
          文字:
          <input type="color" id="document-text-color" value="#1a1a1a">
        </label>
        <label>
          阅读模式:
          <select id="document-mode-select">
            <option value="page">翻页（章内滚动）</option>
            <option value="scroll">连续滚动</option>
          </select>
        </label>
      </div>

      <div class="document-content-area" id="document-content-area">
        <div class="document-empty">
          <div class="document-empty-icon">📖</div>
          <div class="document-empty-text">在左侧书架选择一份文档开始阅读</div>
        </div>
      </div>

      <div class="document-progress-bar">
        <div class="document-progress-fill" id="document-progress-fill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/reader-engine.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.documentReader = new DocumentReader();
    documentReader.init();
  </script>
</body>
</html>
