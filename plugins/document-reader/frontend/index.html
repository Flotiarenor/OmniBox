<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档阅读</title>
  <link rel="stylesheet" href="document-reader.css">
  <!--
    本页是壳 iframe 里的内容页：品牌块/左栏/导航/顶栏/搜索/状态栏/分隔条由壳按
    manifest 的 frontend.chrome 渲染；这里只保留内容（书架、阅读器、朗读设置整页、
    目录与阅读设置弹窗、正文进度条）。

    视图切换与工具栏动作经 postMessage 进来（omnibox:view / omnibox:action /
    omnibox:query），标题/副标题/徽标/状态反向上报（omnibox:chrome）。
  -->
</head>
<body>
  <div id="app">
    <div class="view-body">
      <!-- 书架态：封面网格 -->
      <div class="view-content nr-content obx-scroll" id="nr-shelf-view">
        <div class="nr-grid" id="nr-grid"></div>
      </div>

      <!-- 阅读态：正文 + 底部进度条（进度条通栏，不随正文缩进）。
           进度轨道默认隐藏：书架态、PDF/外部打开都没有可表示的阅读进度；
           阅读器渲染出章节后由脚本显示。 -->
      <div class="nr-reader-view hidden" id="nr-reader-view">
        <div class="document-content-area" id="document-content-area"></div>
      </div>
      <div class="document-progress-bar hidden">
        <div class="document-progress-fill" id="document-progress-fill" style="width:0%"></div>
      </div>

      <!-- 朗读设置：占主区（与 .view-content 同一个位置），不遮挡壳 chrome -->
      <div class="nr-voice-page hidden" id="nr-voice-page">
      <div class="nr-voice-head">
        <span class="nr-voice-title">朗读设置</span>
        <button type="button" class="btn btn-sm" id="nr-voice-refresh">刷新引擎状态</button>
      </div>
        <div class="nr-voice-body obx-scroll">
          <section class="nr-voice-card">
            <h4>引擎</h4>
            <p class="nr-voice-hint" id="nr-voice-status">正在检测…</p>
            <div class="nr-setting-row">
              <label for="nr-voice-engine">使用引擎</label>
              <select id="nr-voice-engine">
                <option value="auto">自动（按音质降级）</option>
                <option value="edge">edge-tts（联网，支持逐字跟随）</option>
                <option value="openai">OpenAI 兼容端点</option>
                <option value="system">系统离线音色（SAPI5）</option>
              </select>
            </div>
            <div class="nr-setting-row">
              <label for="nr-voice-base">端点地址</label>
              <input type="text" id="nr-voice-base" placeholder="http://127.0.0.1:8880">
            </div>
            <div class="nr-setting-row">
              <label for="nr-voice-key">API Key</label>
              <input type="text" id="nr-voice-key" placeholder="本地服务通常留空">
            </div>
            <div class="nr-setting-row">
              <label for="nr-voice-model">模型名</label>
              <input type="text" id="nr-voice-model" placeholder="留空则不发送">
            </div>
          </section>

          <section class="nr-voice-card">
            <h4>音色与语速</h4>
            <div class="nr-setting-row">
              <label for="nr-voice-name">音色</label>
              <input type="text" id="nr-voice-name" placeholder="zh-CN-XiaoxiaoNeural">
            </div>
            <div class="nr-setting-row">
              <label for="nr-voice-rate">语速</label>
              <input type="range" id="nr-voice-rate" min="-50" max="100" step="5" value="100">
              <span class="nr-setting-value" id="nr-voice-rate-value">100%</span>
            </div>
            <div class="nr-setting-row">
              <label for="nr-voice-prefetch">预取深度</label>
              <select id="nr-voice-prefetch">
                <option value="1">1 句 · 逐句现取（端点慢时用）</option>
                <option value="2">2 句</option>
                <option value="3">3 句</option>
                <option value="4">4 句</option>
                <option value="5">5 句 · 推荐</option>
                <option value="6">6 句</option>
                <option value="7">7 句</option>
                <option value="8">8 句 · 上限（首句等待更长）</option>
              </select>
            </div>
            <p class="nr-voice-hint">
              播放当前句时同时合成后面几句：短句的音频撑不住一次合成，靠这个窗口把等待吃掉。
              端点跟不上（读起来一直在等）就选 1，退回逐句现取。
            </p>
            <div class="nr-voice-actions">
              <button type="button" class="btn" id="nr-voice-test">试听这一句</button>
              <span class="nr-voice-hint" id="nr-voice-test-result"></span>
            </div>
          </section>

          <section class="nr-voice-card">
            <h4>朗读缓存</h4>
            <p class="nr-voice-hint">
              合成好的音频按内容缓存，重复朗读同一段不再联网。
              删掉不影响书签与阅读进度，下次朗读按需重建。
            </p>
            <div class="nr-setting-row">
              <label>位置</label>
              <code class="nr-voice-path" id="nr-voice-cache-path">读取中…</code>
            </div>
            <div class="nr-setting-row">
              <label>占用</label>
              <span class="nr-voice-hint" id="nr-voice-cache-size"></span>
            </div>
            <div class="nr-voice-actions">
              <button type="button" class="btn" id="nr-voice-cache-open">打开所在文件夹</button>
              <button type="button" class="btn btn-danger" id="nr-voice-cache-clear">清空缓存</button>
            </div>
          </section>

          <!-- 两档音色各占一张卡片；不出的那一档整张隐藏（自动模式两张都在，
               选定引擎只留对应的那张，系统离线音色一张都不出）。 -->
          <section class="nr-voice-card hidden" id="nr-voice-card-edge">
            <h4>edge-tts 音色</h4>
            <p class="nr-voice-hint">点一下填进上面的音色框，自动模式下就用 edge 念。</p>
            <div class="nr-voice-list" id="nr-voice-list-edge"></div>
          </section>

          <section class="nr-voice-card hidden" id="nr-voice-card-endpoint">
            <h4>OpenAI 兼容端点音色</h4>
            <p class="nr-voice-hint">点一下填进上面的音色框，自动模式下就用端点念。</p>
            <div class="nr-voice-list" id="nr-voice-list-endpoint"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 目录弹窗（自适应大小 + 内部滚动） ============ -->
    <div class="modal" id="nr-toc-modal">
      <div class="modal-box nr-modal-box">
        <h3>目录<span class="nr-modal-sub" id="nr-toc-sub"></span></h3>
        <div class="modal-body">
          <input type="text" id="nr-toc-filter" class="search-input nr-toc-filter" placeholder="筛选章节…">
          <div class="document-chapter-list" id="nr-toc-list"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-nr-close="nr-toc-modal">关闭</button>
        </div>
      </div>
    </div>

    <!-- ============ 阅读设置弹窗 ============ -->
    <div class="modal" id="nr-read-settings-modal">
      <div class="modal-box nr-modal-box nr-modal-sm">
        <h3>阅读设置</h3>
        <div class="modal-body">
          <div class="nr-setting-row">
            <label for="document-font-size">字号</label>
            <input type="range" id="document-font-size" min="12" max="32" value="16" step="1">
            <span class="nr-setting-value" id="document-font-size-value">16</span>
          </div>
          <div class="nr-setting-row">
            <label for="document-line-height">行距</label>
            <input type="range" id="document-line-height" min="1.2" max="2.5" value="1.8" step="0.1">
            <span class="nr-setting-value" id="document-line-height-value">1.8</span>
          </div>
          <div class="nr-setting-row">
            <label for="document-letter-spacing">字间距</label>
            <input type="range" id="document-letter-spacing" min="0" max="5" value="0" step="0.5">
            <span class="nr-setting-value" id="document-letter-spacing-value">0px</span>
          </div>
          <div class="nr-setting-row">
            <label for="document-theme-select">主题</label>
            <select id="document-theme-select">
              <option value="auto">跟随主题</option>
              <option value="sepia">护眼纸</option>
              <option value="dark">夜间</option>
              <option value="green">绿色</option>
              <option value="blue">蓝色</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="nr-setting-row" id="custom-color-row" style="display:none;">
            <label for="document-bg-color">背景色</label>
            <input type="color" id="document-bg-color" value="#ffffff">
          </div>
          <div class="nr-setting-row" id="custom-text-row" style="display:none;">
            <label for="document-text-color">文字色</label>
            <input type="color" id="document-text-color" value="#1a1a1a">
          </div>
          <!-- 正文底色：透出壳背景 / 用指定色彩。与上面的"主题"是两件事 ——
               主题改的是"用哪一套配色"，这一项改的是"底色是实色还是透明"。
               默认"透出背景"，玻璃壳下正文背后就是那张壁纸。 -->
          <div class="nr-setting-row">
            <label for="document-bg-mode">正文底色</label>
            <select id="document-bg-mode">
              <option value="theme">跟随主题</option>
              <option value="show">透出壳背景</option>
              <option value="solid">指定色彩</option>
            </select>
          </div>
          <div class="nr-setting-row" id="body-color-row" style="display:none;">
            <label for="document-body-color">色彩</label>
            <input type="color" id="document-body-color" value="#ffffff">
          </div>
          <div class="nr-setting-row">
            <label for="document-mode-select">阅读模式</label>
            <select id="document-mode-select">
              <option value="scroll">连续滚动</option>
              <option value="page">翻页（章内滚动）</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-nr-close="nr-read-settings-modal">完成</button>
        </div>
      </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/reader-engine.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/reader-tts.js"></script>
  <script src="js/reader-voice-page.js"></script>
  <script src="js/app.js"></script>
  <!-- DocumentReader.prototype 的分片：顺序是硬约束，必须排在 app.js 之后、实例化之前。
       漏挂或错序会在装载期抛 `DocumentReader is not defined`。 -->
  <script src="js/app-shelf.js"></script>
  <script src="js/app-toc.js"></script>
  <script src="js/app-menu.js"></script>
  <script>
    window.documentReader = new DocumentReader();
    documentReader.init();
  </script>
</body>
</html>
